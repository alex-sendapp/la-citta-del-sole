<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Città del Sole</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="La Città del Sole, il giornale degli studenti del Liceo Scientifico Statale Cuoco–Campanella di Napoli.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..800;1,400..600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap">
<style>
/*
  CONCEPT — testata digitale sobria. Il nome della scuola apre la pagina, poi la testata.
  Bianco ghiaccio, testo antracite, un solo accento: il blu Cuoco–Campanella.
  Newsreader (serif editoriale) per testata, titoli e testo degli articoli; Figtree per menu, etichette e dati.
  Si apre sempre chiaro; la versione scura parte solo dal pulsante.
*/
:root{
  --sfondo:#F7F9FB; --superficie:#FFFFFF; --testo:#15181E; --testo-2:#565D69; --linea:#E3E7ED;
  --blu:#1E46B4; --blu-tenue:#EBF0FA; --su-blu:#FFFFFF;
  --f-serif:"Newsreader",Georgia,"Times New Roman",serif;
  --f-sans:"Figtree","Helvetica Neue",Arial,sans-serif;
  --scala:1; --misura:68ch;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --sfondo:#101318; --superficie:#171B22; --testo:#ECEEF2; --testo-2:#A2A9B6; --linea:#2A303A;
  --blu:#86A6F2; --blu-tenue:#1A2338; --su-blu:#101318; color-scheme:dark }
:root[data-size="grande"]{--scala:1.12}
:root[data-size="enorme"]{--scala:1.25}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{font-size:calc(100% * var(--scala))}
body{background:var(--sfondo);color:var(--testo);font-family:var(--f-sans);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--superficie)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blu);outline-offset:3px;border-radius:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.categoria{font-family:var(--f-sans);font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blu)}
.meta{font-size:.82rem;color:var(--testo-2);display:flex;flex-wrap:wrap;gap:2px 12px}
.meta b{color:var(--testo);font-weight:600}

/* ---------- intestazione ---------- */
.testata{background:var(--superficie)}
.testata .wrap{padding-block:clamp(26px,5vw,48px) clamp(18px,3vw,26px);display:grid;justify-items:center;text-align:center;gap:10px}
.scuola{font-family:var(--f-sans);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(1.02rem,3.1vw,1.85rem);line-height:1.25;color:var(--testo);max-width:30ch}
.filetto{width:56px;height:2px;background:var(--blu);margin-block:6px 2px}
.giornale{font-family:var(--f-serif);font-weight:500;font-size:clamp(2.5rem,8.4vw,5.4rem);line-height:.98;letter-spacing:-.02em;font-variation-settings:"opsz" 72}
.giornale em{font-style:italic;font-weight:400}
.sottotitolo{font-family:var(--f-serif);font-style:italic;font-size:clamp(1.05rem,2.4vw,1.3rem);color:var(--testo-2)}
.folio{margin-top:8px;font-size:.8rem;color:var(--testo-2);display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;font-variant-numeric:tabular-nums}
.campanella{display:inline-flex;align-items:center;gap:6px}
.campanella svg{width:14px;height:14px;transform-origin:50% 10%}
.campanella.suona svg{animation:dondola .5s ease-in-out infinite alternate}
@keyframes dondola{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}

/* ---------- menu ---------- */
.menu{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--superficie) 94%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-block:1px solid var(--linea)}
.menu-in{display:flex;align-items:center;gap:8px;min-height:54px}
.voci{list-style:none;margin:0;padding:0;display:flex;gap:2px;flex:1;min-width:0}
.voci a{display:block;padding:15px 12px;font-size:.92rem;font-weight:600;color:var(--testo-2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap}
.voci a:hover{color:var(--testo)}
.voci a[aria-current="page"]{color:var(--testo);border-bottom-color:var(--blu)}
.strumenti{display:flex;align-items:center;gap:2px;margin-left:auto}
.ico{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;padding:0 10px;border-radius:22px;font-size:.88rem;font-weight:600;color:var(--testo);transition:background .15s}
.ico:hover{background:var(--blu-tenue)}
.ico svg{width:19px;height:19px}
.btn-menu{display:none}
@media (max-width:980px){
  .btn-menu{display:inline-flex}
  .voci{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:0;background:var(--superficie);border-bottom:1px solid var(--linea);
    padding:6px max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));box-shadow:0 18px 30px -20px rgba(16,19,24,.35)}
  .voci.aperto{display:flex}
  .voci a{padding:14px 2px;font-size:1.05rem;border-bottom:1px solid var(--linea);margin:0;color:var(--testo)}
  .voci li:last-child a{border-bottom:0}
  .voci a[aria-current="page"]{color:var(--blu);border-bottom-color:var(--linea)}
}
.ricerca{background:var(--superficie);border-bottom:1px solid var(--linea)}
.ricerca .wrap{padding-block:16px 20px;display:grid;gap:10px}
.ricerca input{width:100%;font:500 1.1rem var(--f-sans);padding:12px 14px;border:1px solid var(--linea);background:var(--sfondo);color:var(--testo);border-radius:10px}
.ricerca input:focus{outline:2px solid var(--blu);outline-offset:0;border-color:transparent}
.ricerca ul{list-style:none;margin:0;padding:0;display:grid}
.ricerca li a{display:grid;gap:2px;padding:10px 4px;border-bottom:1px solid var(--linea)}
.ricerca li a b{font-family:var(--f-serif);font-size:1.15rem;font-weight:600}
.ricerca li a:hover b{color:var(--blu)}

/* ---------- immagini (disegni generati dal codice) ---------- */
.figura{display:block;width:100%;max-width:100%;background:var(--blu-tenue);border-radius:6px}
.cornice{overflow:hidden;border-radius:6px}
.cornice .figura{transition:transform .5s ease}
a:hover .cornice .figura{transform:scale(1.03)}

/* ---------- home ---------- */
main{animation:entra .35s ease both}
@keyframes entra{from{transform:translateY(8px)}to{transform:none}}
.sezione{padding-block:clamp(36px,6vw,64px);border-top:1px solid var(--linea)}
.sezione:first-child{border-top:0}
.sez-testa{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;margin-bottom:clamp(20px,3vw,30px)}
.sez-testa h2{font-family:var(--f-serif);font-weight:600;font-size:clamp(1.6rem,3.2vw,2.15rem);letter-spacing:-.01em;line-height:1.1}
.sez-testa p{color:var(--testo-2);font-size:.92rem}
.sez-testa a{font-size:.9rem;font-weight:600;color:var(--blu)}

.principale{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:clamp(22px,4vw,48px);align-items:center}
@media (max-width:860px){.principale{grid-template-columns:1fr}}
.principale .figura{aspect-ratio:16/10}
.principale .testo{display:grid;gap:14px;align-content:center}
.principale h2{font-family:var(--f-serif);font-weight:600;font-size:clamp(2rem,4.6vw,3.3rem);line-height:1.04;letter-spacing:-.018em}
.principale a:hover h2{color:var(--blu)}
.principale .sommario{font-family:var(--f-serif);font-size:clamp(1.1rem,1.8vw,1.28rem);line-height:1.5;color:var(--testo-2)}
.leggi{justify-self:start;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:22px;background:var(--blu);color:var(--su-blu);font-weight:600;font-size:.92rem;transition:transform .15s}
.leggi:hover{transform:translateX(2px)}

.schede{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(26px,3.4vw,40px) clamp(20px,2.6vw,32px)}
@media (max-width:900px){.schede{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:580px){.schede{grid-template-columns:1fr}}
.scheda{display:grid;gap:10px;align-content:start}
.scheda .figura{aspect-ratio:3/2}
.scheda h3{font-family:var(--f-serif);font-weight:600;font-size:1.32rem;line-height:1.18;transition:color .15s}
.scheda:hover h3{color:var(--blu)}
.scheda .sommario{font-size:.94rem;color:var(--testo-2);line-height:1.5}

.categorie{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2vw,22px)}
@media (max-width:900px){.categorie{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.categorie{grid-template-columns:1fr}}
.cat{display:grid;gap:8px;align-content:start;padding:20px 20px 22px;background:var(--superficie);border:1px solid var(--linea);border-radius:10px;transition:border-color .15s,transform .15s}
.cat:hover{border-color:var(--blu);transform:translateY(-2px)}
.cat h3{font-family:var(--f-serif);font-weight:600;font-size:1.45rem;line-height:1.1}
.cat .descr{font-size:.88rem;color:var(--testo-2)}
.cat .conta{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blu)}
.cat .ultimo{font-size:.88rem;border-top:1px solid var(--linea);padding-top:10px;margin-top:4px;color:var(--testo)}

.fascia-blu{background:var(--blu-tenue)}
.fascia-blu .sezione{border-top:0}
.primopiano{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,36px)}
@media (max-width:900px){.primopiano{grid-template-columns:1fr}}
.pp{display:grid;grid-template-columns:1fr;gap:12px;align-content:start}
@media (max-width:900px) and (min-width:581px){.pp{grid-template-columns:200px 1fr;align-items:start}}
.pp .figura{aspect-ratio:3/2;background:var(--superficie)}
.pp .testo{display:grid;gap:8px}
.pp h3{font-family:var(--f-serif);font-weight:600;font-size:1.4rem;line-height:1.15}
.pp:hover h3{color:var(--blu)}
.pp .sommario{font-size:.94rem;color:var(--testo-2)}

.giochi{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(22px,4vw,48px)}
@media (max-width:860px){.giochi{grid-template-columns:1fr}}
.giochi .col{display:grid;gap:12px;align-content:start}
.giochi h3{font-family:var(--f-serif);font-weight:600;font-size:1.7rem;line-height:1.12}
.giochi form{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.giochi label{font-size:.9rem;color:var(--testo-2)}
.giochi input{width:8em;font:600 1.05rem var(--f-sans);padding:10px 12px;border-radius:10px;border:1px solid var(--linea);background:var(--superficie);color:var(--testo);min-height:44px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:22px;font-weight:600;font-size:.92rem;background:var(--blu);color:var(--su-blu)}
.btn.vuoto{background:transparent;color:var(--testo);box-shadow:inset 0 0 0 1px var(--linea)}
.btn.vuoto:hover{box-shadow:inset 0 0 0 1px var(--blu);color:var(--blu)}
.esito{font-weight:600;min-height:1.5em;color:var(--blu)}
.giochi details{border-top:1px solid var(--linea);padding-top:10px}
.giochi summary{cursor:pointer;font-weight:600;min-height:32px}
.giochi details p{margin-top:6px;color:var(--testo-2)}
.sapevi{display:grid;gap:12px}
.sapevi p{font-family:var(--f-serif);font-size:1.12rem;line-height:1.45;padding-left:16px;border-left:2px solid var(--blu)}

/* ---------- articolo ---------- */
.progresso{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:3px;background:var(--blu);width:0;z-index:50}
.articolo{padding-block:clamp(30px,5vw,56px) 70px}
.art-testa{max-width:860px;display:grid;gap:16px}
.art-testa h1{font-family:var(--f-serif);font-weight:600;font-size:clamp(2.1rem,5.4vw,3.8rem);line-height:1.04;letter-spacing:-.02em}
.art-testa .sommario{font-family:var(--f-serif);font-size:clamp(1.15rem,2vw,1.35rem);line-height:1.5;color:var(--testo-2);max-width:62ch}
.art-figura{margin-block:clamp(22px,3vw,34px)}
.art-figura .figura{aspect-ratio:21/9}
@media (max-width:600px){.art-figura .figura{aspect-ratio:3/2}}
.art-griglia{display:grid;grid-template-columns:minmax(0,var(--misura)) minmax(0,300px);gap:clamp(30px,5vw,72px);justify-content:space-between;align-items:start}
@media (max-width:1000px){.art-griglia{grid-template-columns:minmax(0,1fr)}}
.corpo{font-family:var(--f-serif);font-size:clamp(1.12rem,1.6vw,1.22rem);line-height:1.72;display:grid;gap:1.1em}
.corpo h3{font-family:var(--f-sans);font-size:1.15rem;font-weight:700;margin-top:.6em;line-height:1.3}
.corpo blockquote{margin:.4em 0;padding-left:20px;border-left:3px solid var(--blu);font-style:italic;font-size:1.5rem;line-height:1.35}
.corpo ul,.corpo ol{margin:0;padding-left:1.3em;display:grid;gap:.45em}
.corpo .a-margine{font-family:var(--f-sans);font-size:.95rem;line-height:1.55;color:var(--testo-2);background:var(--blu-tenue);border-radius:8px;padding:14px 16px}
.corpo .a-margine b{color:var(--testo);display:block;margin-bottom:2px}
.corpo .pro-contro{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.corpo .pro-contro{grid-template-columns:1fr}}
.corpo .pro-contro > div{border:1px solid var(--linea);border-radius:10px;padding:16px 18px;display:grid;gap:8px;align-content:start;font-size:1.02rem;line-height:1.6;background:var(--superficie)}
.corpo .pro-contro .etichetta{font-family:var(--f-sans);font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blu)}
.lato{display:grid;gap:26px;align-content:start}
@media (min-width:1001px){.lato{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}}
.blocco{display:grid;gap:10px;padding-top:14px;border-top:2px solid var(--testo)}
.blocco h2{font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.blocco ol{margin:0;padding-left:1.2em;display:grid;gap:8px;font-size:.9rem;color:var(--testo-2)}
.blocco ol a{color:var(--blu);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.azioni{display:flex;flex-wrap:wrap;gap:8px}
.leggi-anche{margin-top:clamp(40px,6vw,64px);padding-top:30px;border-top:1px solid var(--linea)}

/* ---------- pagine ---------- */
.pagina{padding-block:clamp(34px,5vw,60px) 70px;max-width:820px;display:grid;gap:20px}
.pagina h1{font-family:var(--f-serif);font-weight:600;font-size:clamp(2.1rem,5vw,3.2rem);line-height:1.05;letter-spacing:-.015em}
.pagina .intro{font-family:var(--f-serif);font-size:1.2rem;color:var(--testo-2);line-height:1.55}
.pagina h2{font-size:1.1rem;font-weight:700;margin-top:10px}
.regole{list-style:none;margin:0;padding:0;counter-reset:r;display:grid}
.regole li{counter-increment:r;display:grid;grid-template-columns:2.2rem 1fr;gap:12px;padding-block:16px;border-top:1px solid var(--linea)}
.regole li::before{content:counter(r);font-family:var(--f-serif);font-size:1.5rem;font-weight:600;color:var(--blu);line-height:1.1}
.regole h3{font-size:1.02rem;font-weight:700;margin-bottom:3px}
.regole p{color:var(--testo-2)}
.pagina ul.semplice{margin:0;padding-left:1.2em;display:grid;gap:6px}
.membri{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:560px){.membri{grid-template-columns:1fr}}
.membro{background:var(--superficie);border:1px solid var(--linea);border-radius:10px;padding:18px 20px;display:grid;gap:4px}
.membro .nome{font-family:var(--f-serif);font-size:1.45rem;font-weight:600;line-height:1.15}
.membro .ruolo{font-size:.9rem;color:var(--testo-2)}
.passi{margin:0;padding-left:1.3em;display:grid;gap:8px}
.cat-testa{display:grid;gap:8px;margin-bottom:clamp(24px,3vw,34px)}
.cat-testa h1{font-family:var(--f-serif);font-weight:600;font-size:clamp(2.3rem,6vw,3.6rem);line-height:1;letter-spacing:-.02em}
.cat-testa p{color:var(--testo-2);font-size:1.05rem}

/* ---------- footer ---------- */
.piede{background:var(--superficie);border-top:1px solid var(--linea);margin-top:20px}
.piede .wrap{padding-block:44px 40px;display:grid;gap:34px}
.piede-testa{display:grid;gap:4px}
.piede-testa .s{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.82rem}
.piede-testa .g{font-family:var(--f-serif);font-size:1.9rem;font-weight:500;line-height:1.1}
.piede-col{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px;font-size:.9rem;color:var(--testo-2)}
@media (max-width:860px){.piede-col{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.piede-col{grid-template-columns:1fr}}
.piede h4{margin:0 0 8px;font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--testo)}
.piede ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.piede ul a{display:inline-block;padding-block:5px}
.piede a:hover{color:var(--blu)}
.piede .fondo{border-top:1px solid var(--linea);padding-top:18px;font-size:.8rem;color:var(--testo-2)}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

<div class="progresso" id="progresso" hidden></div>

<header class="testata">
  <div class="wrap">
    <a class="scuola" href="#" id="t-scuola"></a>
    <span class="filetto" aria-hidden="true"></span>
    <a class="giornale" href="#">La Città del Sole</a>
    <p class="sottotitolo">Il giornale degli studenti</p>
    <p class="folio"><span id="oggi"></span><span id="t-anno"></span>
      <span class="campanella" id="campanella" title="Orario indicativo: 6 ore da 60 minuti dalle 8:00, lunedì–venerdì">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span id="campanella-txt"></span></span></p>
  </div>
</header>

<nav class="menu" aria-label="Menu principale">
  <div class="wrap menu-in" style="position:relative">
    <button class="ico btn-menu" id="btn-menu" aria-expanded="false" aria-controls="voci">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Sezioni</button>
    <ul class="voci" id="voci"></ul>
    <div class="strumenti">
      <button class="ico" id="btn-cerca" aria-expanded="false" aria-controls="ricerca" aria-label="Cerca negli articoli">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>

<p>Tommaso Campanella nasce a Stilo, in Calabria, nel 1568. Frate domenicano, filosofo inquieto, nel 1599 viene arrestato con l'accusa di aver organizzato una congiura contro il governo spagnolo. Passerà circa ventisette anni nelle carceri di Napoli. È lì dentro, nel 1602, che scrive <em>La Città del Sole</em>: il racconto di una città ideale, costruita su sette cerchi concentrici, con un tempio dedicato al Sole al centro.</p>

<p>Vincenzo Cuoco nasce nel 1770 a Civitacampomarano, in Molise, e partecipa alla Repubblica Napoletana del 1799. Quando la repubblica cade finisce in esilio, e nel 1801 pubblica il <em>Saggio storico sulla rivoluzione napoletana</em>. La sua tesi è ancora attuale: quella rivoluzione fallì perché fu «passiva», pensata da pochi e calata dall'alto, con idee e parole lontane dalla vita della gente.</p>

  corpo: `
<p>Napoli è forse l'unica città al mondo che si chiama “nuova” da venticinque secoli. Il nome viene dal greco <em>Neápolis</em>: la fondarono, secondo la tradizione intorno al 470 a.C., i coloni greci di Cuma, accanto a un insediamento più antico, Partenope, sorto sull'altura di Pizzofalcone.</p>
<span class="a-margine"><b>Partenope</b> è il nome della sirena che, secondo il mito, si lasciò morire dopo che Ulisse resistette al suo canto. Il suo corpo sarebbe arrivato a riva proprio qui.</span>
<p>La città nuova fu progettata a tavolino, con un sistema di strade ortogonali: tre grandi vie parallele, i decumani, tagliate da vie più strette, i cardini. È uno schema che i manuali chiamano “ippodameo”, dal nome dell'architetto Ippodamo di Mileto, e lo studiamo in storia dell'arte senza accorgerci che lo percorriamo ogni giorno.</p>
<h3>L'itinerario: un'ora, tre strade</h3>
<ol>
<li><b>Decumano inferiore.</b> È quella che tutti chiamano Spaccanapoli: guardatela dall'alto della Certosa di San Martino e capirete il nome, perché taglia la città come una riga dritta.</li>

<li><b>Decumano superiore.</b> Il più stretto e silenzioso, tra via della Sapienza e via Anticaglia, dove restano gli archi del teatro romano inglobati nelle case.</li>

  corpo: `
<p>Quando la terra trema a Pozzuoli, i telefoni di mezza Napoli si riempiono di messaggi inoltrati, audio di sconosciuti e previsioni che nessuno può fare. Proviamo a fare il contrario: capire cosa succede, con calma, usando le fonti giuste.</p>
<h3>Cos'è il bradisismo</h3>
<p>I Campi Flegrei sono una caldera: una grande depressione nata dal collasso del terreno dopo eruzioni molto antiche. In quest'area il suolo si alza e si abbassa lentamente, nel corso di mesi e anni. Questo movimento si chiama bradisismo, dal greco <em>bradýs</em>, “lento”. Il sollevamento è spesso accompagnato da piccoli terremoti, generalmente poco profondi.</p>
<span class="a-margine"><b>Un esempio da manuale.</b> Le colonne del Macellum di Pozzuoli, il cosiddetto “Tempio di Serapide”, portano i fori lasciati da molluschi marini: segno che in passato sono state sott'acqua e poi sono riemerse.</span>
<p>Non è un fenomeno nuovo. Il Novecento ha conosciuto due grandi crisi, nel 1970-72 e nel 1982-84, e dal 2005 è in corso una nuova fase di sollevamento, seguita giorno per giorno dai ricercatori.</p>
<h3>Chi lo misura</h3>
<p>Il monitoraggio è affidato all'Osservatorio Vesuviano, oggi sezione di Napoli dell'Istituto Nazionale di Geofisica e Vulcanologia (INGV). Fondato nel 1841, è il più antico osservatorio vulcanologico del mondo. Stazioni sismiche, GPS, misure dei gas e del suolo producono bollettini pubblici e periodici che chiunque può leggere.</p>
<h3>Cosa possiamo fare noi</h3>
<ul>
<li>Informarci solo da fonti ufficiali: INGV-Osservatorio Vesuviano, Protezione Civile, Comune.</li>
<li>Conoscere il piano di emergenza della propria zona e le aree di attesa, senza aspettare un evento.</li>
<li>Non inoltrare messaggi senza fonte: un audio allarmistico fa più danni di quanto sembri.</li>
<li>Partecipare con serietà alle prove di evacuazione della scuola.</li>
</ul>
<p>Conoscere un fenomeno naturale non lo rende innocuo, ma toglie spazio alla paura costruita sul niente. È anche il motivo per cui studiamo scienze.</p>`,

<p>Chi dice di non aver mai chiesto aiuto a un chatbot per un compito, probabilmente non sta dicendo tutta la verità. Gli strumenti di intelligenza artificiale generativa sono ovunque. Il problema non è lo strumento: è quando smettiamo di pensare e cominciamo solo a incollare.</p>
<p>In redazione abbiamo chiesto consiglio ai due compagni che sviluppano il sito e lavorano ogni giorno con questi sistemi. Sanno bene quanto sono bravi a produrre testi credibili, e quanto facilmente sbagliano con sicurezza. Ecco le regole che la nostra redazione si è data.</p>
<ol>
<li><b>Prima pensa, poi chiedi.</b> Scrivi da solo la scaletta. Usa l'IA per metterla alla prova, non per inventarla.</li>
<li><b>Verifica ogni dato.</b> Date, nomi e citazioni vanno controllati su una fonte primaria. I modelli linguistici possono inventare riferimenti che sembrano veri.</li>
<li><b>Dichiara l'uso.</b> Se un testo è stato rivisto con l'aiuto di un assistente, si dice. È onestà, non debolezza.</li>
<li><b>Nessun dato personale.</b> Non incollare mai nomi, voti o situazioni di compagni e professori in un chatbot: quei testi escono dal tuo controllo.</li>
<li><b>Fatti contraddire.</b> Chiedi all'IA di trovare i punti deboli del tuo ragionamento. È l'uso più utile e il meno praticato.</li>
<li><b>L'ultima parola è tua.</b> Se non sapresti spiegare a voce quello che hai consegnato, non è un tuo lavoro.</li>
</ol>
<span class="a-margine"><b>Prova pratica.</b> Chiedete a un assistente la biografia di un personaggio poco noto della vostra città, poi controllatela su un'enciclopedia. Contate gli errori.</span>
<blockquote>Un assistente che scrive al posto tuo ti fa risparmiare un'ora. Uno che ti fa domande ti fa risparmiare un anno.</blockquote>
<p>A scuola si va per imparare a ragionare, non per produrre fogli. L'intelligenza artificiale può essere un ottimo compagno di studio, a patto di ricordare chi deve uscire dall'esame con qualcosa in testa.</p>`,

  slug: "cinque-libri-che-parlano-di-noi", rubrica: "biblioteca", firma: "C.M.", data: "2026-11-01",

  sommario: "Napoli, le isole del golfo, le città che non esistono e la chimica raccontata come un romanzo. Una lista breve, da finire prima della maturità.",
  corpo: `
<p>Le liste di libri consigliati spesso sembrano compiti per le vacanze. Questa no: sono cinque titoli scelti perché parlano di luoghi che conosciamo o di domande che ci facciamo, e si leggono in pochi giorni.</p>
<h3>1. Elsa Morante, <em>L'isola di Arturo</em> (1957)</h3>
<p>Procida, un ragazzo che cresce quasi da solo e idealizza un padre sempre assente. Ha vinto il Premio Strega ed è uno dei romanzi più belli mai scritti sull'adolescenza. Leggetelo, poi prendete l'aliscafo.</p>
<h3>2. Anna Maria Ortese, <em>Il mare non bagna Napoli</em> (1953)</h3>
<p>Racconti e reportage su una Napoli del dopoguerra lontana dalle cartoline. Un libro scomodo, che fece discutere molto. Utile per capire quanto il modo di raccontare una città cambi la città stessa.</p>
<h3>3. Italo Calvino, <em>Le città invisibili</em> (1972)</h3>
<p>Marco Polo descrive a Kublai Khan città che forse non esistono. Ogni capitolo dura poche pagine. È il compagno perfetto della Città del Sole di Campanella: due modi di immaginare il luogo in cui vorremmo vivere.</p>
<span class="a-margine"><b>Collegamento per l'orale.</b> Utopie a confronto: Campanella, Moro, Calvino. Funziona in italiano, filosofia e storia dell'arte.</span>
<h3>4. Erri De Luca, <em>Montedidio</em> (2001)</h3>
<p>Un ragazzo di tredici anni nel rione Sanità, un boomerang, un diario scritto su un rotolo di carta. Lingua asciutta, napoletana anche quando è italiana.</p>
<h3>5. Primo Levi, <em>Il sistema periodico</em> (1975)</h3>
<p>Ventuno racconti, ognuno intitolato a un elemento chimico. Levi era chimico prima che scrittore, e qui la scienza diventa racconto. Nel 2006 la Royal Institution di Londra lo ha indicato come il miglior libro di scienza mai scritto. Per uno scientifico, è quasi obbligatorio.</p>
<blockquote>Leggere un libro ambientato nel proprio quartiere è un modo per vederlo, finalmente, da fuori.</blockquote>
<p>Avete un titolo da aggiungere? La rubrica Biblioteca accetta recensioni di massimo tremila battute, firmate con le iniziali.</p>`,

{
  slug: "crisi-della-lettura", rubrica: "biblioteca", firma: "C.M.", data: "2026-11-05", primoPiano: true,
  titolo: "Crisi della letteratura",
  sommario: "Perché non riusciamo più a leggere? Il nostro cervello è stato allenato a scrollare, a saltare da uno stimolo all'altro. La buona notizia è che si può riallenare.",
  corpo: `
<p>Perché non riusciamo più a leggere? Capita sempre più spesso che le persone reputino l'attività della lettura faticosa: apri un libro e ti rendi conto solo dieci minuti dopo che stai leggendo sempre la stessa frase.</p>
<p>E questo non riguarda solo il calo di ore che l'italiano medio spende nella lettura settimanale (in soli due anni è diminuito di quasi un'ora), ma si delinea un vero e proprio cambiamento qualitativo della lettura. Le modalità con cui ci dedichiamo a essa stanno venendo profondamente rimodellate dalla tecnologia. Difatti viene meno proprio la capacità di immergersi in un testo, di riflettere sugli argomenti trattati e collegarli a esperienze personali.</p>
<p>E ciò non accade perché si è perso l'amore per la letteratura, ma perché il nostro cervello sta facendo solo ciò per cui è stato allenato negli ultimi anni: scrollare, saltare rapidamente da uno stimolo all'altro. I social media e gli smartphone offrono al nostro cervello gratificazioni frequenti, e il sistema della dopamina si attiva: così il cervello impara che quest'ambiente premia la velocità, l'immediatezza, la gratificazione rapida. Dunque il nostro cervello si adatta di conseguenza; e dopo tutta questa dopamina, chiedergli di concentrarsi per ore su delle pagine sembra impossibile.</p>
<h3>Leggere senza capire</h3>
<p>L'ecosistema digitale, inoltre, modifica proprio l'atteggiamento cognitivo e interpretativo delle persone: l'indagine OCSE sulle competenze degli adulti del 2024 rileva che il 35% degli italiani tra i 16 e i 65 anni fa fatica a comprendere testi più complessi di quelli brevi, espliciti e semplici. Questo fenomeno si chiama analfabetismo funzionale, cioè leggere senza capire effettivamente il testo.</p>
<span class="a-margine"><b>Analfabetismo funzionale.</b> Non vuol dire non saper leggere: vuol dire riconoscere le parole senza riuscire a usare davvero ciò che il testo dice.</span>
<p>Da ciò scaturiscono conseguenze gravissime. La perdita della capacità di una lettura profonda comporta un impoverimento cognitivo: minor capacità di pensiero critico, di sostenere ragionamenti complessi, o addirittura di costruire connessioni tra idee.</p>
<h3>Si può tornare a leggere?</h3>
<p>Tutto sommato, però, la vera domanda rimane un'altra: è possibile riprendere a leggere con regolarità? La neuroplasticità del nostro cervello, cioè la capacità del sistema nervoso di modificare la propria struttura e la propria funzione in risposta all'esperienza, lo rende possibile. E per far adattare il nostro cervello a un ritmo più lento, e di conseguenza riprendere a leggere, esistono delle strategie:</p>
<ul>
<li><b>Tenere il telefono fuori dalla vista:</b> anche la sua semplice presenza può sottrarre capacità cognitiva disponibile.</li>
<li><b>Scegliere libri che interessano davvero,</b> senza sentirsi obbligati a leggere un classico o un titolo ritenuto più prestigioso.</li>
<li><b>Fissare un appuntamento quotidiano:</b> anche 15 minuti ogni sera.</li>
<li><b>Non misurare il successo dalla velocità:</b> leggere lentamente e comprendere è preferibile a sfogliare molti libri senza attenzione.</li>
</ul>
<blockquote>Leggere in profondità è un'abilità, e come ogni abilità deve essere allenata con costanza o si rischia di perderla.</blockquote>`,

  corpo: `
<p>Con una circolare del Ministero dell'Istruzione e del Merito, dall'anno scolastico 2025/26 il divieto di usare il cellulare durante l'orario scolastico è stato esteso anche alle scuole secondarie di secondo grado, con le eccezioni previste, per esempio per gli studenti che ne hanno bisogno per motivi di salute o per un percorso personalizzato. Il regolamento di ogni istituto stabilisce i dettagli.</p>

    <div class="primopiano">${scelti.map(a => `<a class="pp" href="#a-${a.slug}">${figura(a.slug)}<div class="testo">${etichetta(a)}<h3>${esc(a.titolo)}</h3><p class="sommario">${esc(a.sommario)}</p><div class="meta"><span>di <b>${esc(firmaDi(a))}</b></span></div></div></a>`).join("")}</div>
  </section>
  </div></div><div class="wrap">
  <section class="sezione" aria-labelledby="h-giochi">
    <div class="sez-testa"><h2 id="h-giochi">Giochi</h2><a href="#rubrica-ricreazione">Tutti i giochi →</a></div>
    ${giochiHTML()}
  </section></div>`;
}

function categoria(id) {
  const c = catDi(id); if (!c) return nonTrovato();
  if (c.giochi) return `<div class="articolo"><header class="cat-testa"><span class="categoria">Categoria</span><h1>${esc(c.nome)}</h1><p>${esc(c.descr)}</p></header>${giochiHTML()}</div>`;
  const lista = ARTICOLI.filter(a => a.rubrica === id).sort(perData);
  return `<div class="articolo">
    <header class="cat-testa"><span class="categoria">Categoria</span><h1>${esc(c.nome)}</h1><p>${esc(c.descr)} · ${lista.length} ${lista.length === 1 ? "articolo" : "articoli"}</p></header>
    ${lista.length ? `<div class="schede">${lista.map(a => scheda(a, true)).join("")}</div>` : `<p class="intro">Questa sezione è ancora vuota. Il primo articolo potrebbe essere il tuo: <a href="#redazione" style="color:var(--blu)">ecco come proporlo</a>.</p>`}
  </div>`;
}

function articolo(slug) {
  const a = ARTICOLI.find(x => x.slug === slug); if (!a) return nonTrovato();
  const c = catDi(a.rubrica);
  const altri = ARTICOLI.filter(x => x !== a && x.rubrica === a.rubrica).concat(ARTICOLI.filter(x => x !== a && x.rubrica !== a.rubrica).sort(perData)).slice(0, 3);
  return `<article class="articolo">
    <header class="art-testa">${etichetta(a)}<h1>${esc(a.titolo)}</h1><p class="sommario">${esc(a.sommario)}</p>${metaRiga(a)}</header>
    <div class="art-figura">${figura(a.slug)}</div>
    <div class="art-griglia">
      <div class="corpo">${a.corpo}</div>
      <aside class="lato" aria-label="Informazioni sull'articolo">
        <div class="blocco"><h2>Fonti</h2><ol>${a.fonti.map(([t, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("")}</ol></div>
        <div class="blocco"><h2>Condividi</h2><div class="azioni"><button class="btn vuoto" id="copia-link" type="button">Copia il link</button><a class="btn vuoto" href="#rubrica-${c.id}">Altro in ${esc(c.nome)}</a></div>
          <p id="copia-esito" class="meta" aria-live="polite"></p></div>
      </aside>
    </div>
    <section class="leggi-anche" aria-labelledby="h-anche"><div class="sez-testa"><h2 id="h-anche">Leggi anche</h2></div><div class="schede">${altri.map(x => scheda(x)).join("")}</div></section>
  </article>`;
}

function regole() {
  const r = [
    ["Niente dati che identificano", "Non pubblichiamo classe, ritardi, problemi disciplinari o situazioni personali di studenti. I nomi degli autori compaiono solo con liberatoria scritta."],
    ["Foto e video solo con consenso", "Immagini di studenti solo con consenso informato dei genitori, o dell'interessato se maggiorenne. Le illustrazioni del sito sono disegni generati dal codice."],
    ["Voti e valutazioni restano privati", "Risultati di verifiche, voti e giudizi si comunicano solo con i canali riservati della scuola."],
    ["Nessun dato sensibile", "Diagnosi, salute, informazioni personali particolari non vengono divulgate in alcun modo."],
    ["Niente allarmismo", "Nessun contenuto che generi paura ingiustificata sulla scuola o sui minori. Sui temi delicati citiamo solo fonti ufficiali."],
    ["Fonti dichiarate", "Ogni articolo elenca le sue fonti. Se troviamo un errore lo correggiamo e lo segnaliamo."],
    ["Pubblicazione autorizzata", "Ogni numero è rivisto dalla docente referente e pubblicato sotto la responsabilità del Dirigente scolastico."]
  ];
  return `<div class="pagina">
    <span class="categoria">La redazione</span>
    <h1>Regole della redazione</h1>
    <p class="intro">Le regole che seguiamo per ogni articolo, dalle indicazioni della nostra docente sulle pubblicazioni online delle scuole.</p>
    <ol class="regole">${r.map(([t, d]) => `<li><div><h3>${t}</h3><p>${d}</p></div></li>`).join("")}</ol>
    <h2>Cosa possiamo pubblicare</h2>
    <ul class="semplice"><li>Articoli, interviste e approfondimenti senza dati personali identificativi.</li><li>Racconti di attività, eventi e progetti della scuola, nel rispetto della riservatezza.</li><li>Materiali didattici e informazioni generali non riconducibili a singoli studenti.</li></ul>
  </div>`;
}

function redazione() {
  return `<div class="pagina">
    <span class="categoria">Chi siamo</span>
    <h1>La redazione</h1>
    <p class="intro">Quattro studenti di quinta del ${esc(GIORNALE.scuola)}, ${esc(GIORNALE.citta)}. Due scrivono gli articoli, due costruiscono e pubblicano il sito.</p>
    <div class="membri">${REDAZIONE.map(m => `<div class="membro"><span class="nome">${esc(GIORNALE.mostraNomiCompleti ? m.nome : m.sigla)}</span><span class="ruolo">${esc(m.ruolo)}</span>${m.rubriche ? `<span class="ruolo">Scrive in: ${esc(m.rubriche)}</span>` : ""}</div>`).join("")}</div>
    <h2>Come proporre un articolo</h2>
    <ol class="passi">
      <li>Scegli la categoria e scrivi un titolo e due righe di sommario.</li>
      <li>Scrivi il pezzo: da 2.000 a 5.000 battute, con l'elenco delle fonti in fondo.</li>
      <li>Rileggilo con le <a href="#circolare" style="color:var(--blu)">regole della redazione</a> sotto mano.</li>
      <li>Consegnalo alla redazione o a ${esc(GIORNALE.referente)}: lo rivediamo insieme prima della pubblicazione.</li>
    </ol>
    <h2>Quando esce</h2>
    <p>Un numero al mese durante l'anno scolastico. Numero ${GIORNALE.numero}: ${esc(GIORNALE.mese)}. Prossimo numero: ${esc(GIORNALE.prossimo)}.</p>
  </div>`;
}

function nonTrovato() { return `<div class="pagina"><h1>Pagina non trovata</h1><p class="intro">La pagina che cerchi non esiste o è stata spostata. <a href="#" style="color:var(--blu)">Torna alla prima pagina</a>.</p></div>`; }

/* ---------- router: #a-slug, #rubrica-id, #circolare, #redazione, #ricreazione ---------- */
function render() {
  const h = decodeURIComponent(location.hash.slice(1));
  let html, attivo = null, isArt = false;
  if (!h || h === "ricreazione") html = home();
  else if (h.startsWith("a-")) { const a = ARTICOLI.find(x => x.slug === h.slice(2)); html = articolo(h.slice(2)); isArt = !!a; attivo = a && a.rubrica; }
  else if (h.startsWith("rubrica-")) { attivo = h.slice(8); html = categoria(attivo); }
  else if (h === "circolare") html = regole();
  else if (h === "redazione") html = redazione();
  else html = nonTrovato();
  vista.innerHTML = (!h || h === "ricreazione") ? html : `<div class="wrap">${html}</div>`;
  document.querySelectorAll("#voci a").forEach(a => { if (a.dataset.id === attivo) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  $("#voci").classList.remove("aperto"); $("#btn-menu").setAttribute("aria-expanded", "false");
  $("#progresso").hidden = !isArt;
  const art = isArt && ARTICOLI.find(x => x.slug === h.slice(2));
  document.title = art ? `${art.titolo} · La Città del Sole` : "La Città del Sole";
  if (h === "ricreazione") requestAnimationFrame(() => $("#ricreazione")?.scrollIntoView({ block: "start" })); else window.scrollTo(0, 0);
  vista.style.animation = "none"; void vista.offsetWidth; vista.style.animation = "";
  requestAnimationFrame(disegnaTutte);
  collega();
}

function collega() {
  const f = $("#form-problema");
  if (f) f.addEventListener("submit", e => {
    e.preventDefault();
    const v = parseFloat($("#risposta").value.replace(",", ".").replace("°", ""));
    const out = $("#esito");
    if (isNaN(v)) { out.textContent = "Scrivi un numero, per esempio 30,5."; return; }
    out.textContent = Math.abs(v - PROBLEMA.risposta) <= PROBLEMA.tolleranza ? "Risposta giusta. Apri la soluzione per il perché." : "Non ancora: prova con l'aiuto.";
  });
  const cp = $("#copia-link");
  if (cp) cp.addEventListener("click", () => {
    const url = location.href, out = $("#copia-esito");
    if (!navigator.clipboard) { out.textContent = url; return; }
    navigator.clipboard.writeText(url).then(() => { out.textContent = "Link copiato."; }).catch(() => { out.textContent = url; });
  });
}

function campanella() {
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes(), g = d.getDay();
  const el = $("#campanella"), t = $("#campanella-txt"); let txt, suona = false;
  if (g === 0 || g === 6) txt = "Oggi niente lezioni";
  else if (m < 480) txt = `Prima campanella alle 8:00`;
  else if (m >= 840) txt = "Lezioni finite";
  else { const ora = Math.floor((m - 480) / 60) + 1, resto = 60 - ((m - 480) % 60); suona = resto <= 3; txt = `${ora}ª ora · campanella tra ${resto} min`; }
  t.textContent = txt; el.classList.toggle("suona", suona);
}

function impianto() {
  const d = new Date();
  $("#t-scuola").textContent = GIORNALE.scuola.replace(/[“”"]/g, "");
  $("#oggi").textContent = `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`;
  $("#t-anno").textContent = `Anno scolastico ${GIORNALE.annoScolastico} · Numero ${GIORNALE.numero}`;
  $("#voci").innerHTML = CATEGORIE.filter(c => !c.giochi).map(c => `<li><a href="#rubrica-${c.id}" data-id="${c.id}">${esc(c.nome)}</a></li>`).join("");
  $("#piede").innerHTML = `
    <div class="piede-testa"><span class="s">${esc(GIORNALE.scuola.replace(/[“”"]/g, ""))}</span><span class="g">La Città del Sole</span></div>
    <div class="piede-col">
      <div><h4>Il giornale</h4><p>Il giornale degli studenti, online. Anno scolastico ${esc(GIORNALE.annoScolastico)}, numero ${GIORNALE.numero} (${esc(GIORNALE.mese)}). Ogni numero è rivisto dalla docente referente e pubblicato sotto la responsabilità del Dirigente scolastico.</p></div>
      <div><h4>Categorie</h4><ul>${CATEGORIE.map(c => `<li><a href="#rubrica-${c.id}">${esc(c.nome)}</a></li>`).join("")}</ul></div>
      <div><h4>Redazione</h4><ul>${REDAZIONE.map(m => `<li>${esc(GIORNALE.mostraNomiCompleti ? m.nome : m.sigla)}</li>`).join("")}<li><a href="#redazione">Chi siamo e come scriverci</a></li></ul></div>
      <div><h4>Collegamenti</h4><ul><li><a href="#">Prima pagina</a></li><li><a href="#circolare">Regole della redazione</a></li><li><a href="#ricreazione">Il problema del mese</a></li></ul></div>
    </div>
    <p class="fondo">${esc(GIORNALE.scuola.replace(/[“”"]/g, ""))} · ${esc(GIORNALE.citta)}</p>`;

  const root = document.documentElement;
  const aggiornaTema = () => { const scuro = root.dataset.theme === "dark"; $("#ico-luna").hidden = scuro; $("#ico-sole").hidden = !scuro; $("#btn-tema").setAttribute("aria-label", scuro ? "Passa alla versione chiara" : "Passa alla versione scura"); };
  if (store.get("cds-tema2") === "dark") root.dataset.theme = "dark";
  aggiornaTema();
  $("#btn-tema").addEventListener("click", () => { const n = root.dataset.theme === "dark" ? "light" : "dark"; root.dataset.theme = n; store.set("cds-tema2", n); aggiornaTema(); disegnaTutte(); });

  const taglie = ["", "grande", "enorme"]; let ti = Math.max(0, taglie.indexOf(store.get("cds-taglia") || ""));
  const applica = () => { if (taglie[ti]) root.dataset.size = taglie[ti]; else delete root.dataset.size; };
  applica();
  $("#btn-testo").addEventListener("click", () => { ti = (ti + 1) % taglie.length; applica(); store.set("cds-taglia", taglie[ti]); requestAnimationFrame(disegnaTutte); });

  const bm = $("#btn-menu"), voci = $("#voci");
  bm.addEventListener("click", () => { const ap = voci.classList.toggle("aperto"); bm.setAttribute("aria-expanded", String(ap)); });

  const pannello = $("#ricerca"), q = $("#q"), ris = $("#risultati"), bc = $("#btn-cerca");
  bc.addEventListener("click", () => { pannello.hidden = !pannello.hidden; bc.setAttribute("aria-expanded", String(!pannello.hidden)); if (!pannello.hidden) { voci.classList.remove("aperto"); q.focus(); } });
  q.addEventListener("input", () => {
    const s = q.value.trim().toLowerCase();
    if (s.length < 2) { ris.innerHTML = ""; return; }
    const trovati = ARTICOLI.filter(a => (a.titolo + " " + a.sommario + " " + a.corpo.replace(/<[^>]+>/g, " ")).toLowerCase().includes(s));
    ris.innerHTML = trovati.length ? trovati.map(a => `<li><a href="#a-${a.slug}"><span class="categoria">${esc(catDi(a.rubrica).nome)}</span><b>${esc(a.titolo)}</b></a></li>`).join("") : `<li class="meta" style="padding:10px 4px">Nessun articolo contiene “${esc(q.value)}”.</li>`;
  });
  ris.addEventListener("click", e => { if (e.target.closest("a")) { pannello.hidden = true; bc.setAttribute("aria-expanded", "false"); } });

  addEventListener("scroll", () => { const p = $("#progresso"); if (p.hidden) return; const h = document.documentElement.scrollHeight - innerHeight; p.style.width = (h > 0 ? scrollY / h * 100 : 0) + "%"; }, { passive: true });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(disegnaTutte, 120); });
  document.fonts?.ready.then(disegnaTutte);
  addEventListener("hashchange", render);
  campanella(); setInterval(campanella, 30000);
  render();
}
impianto();
</script>
