<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Città del Sole</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="La Città del Sole, giornale degli studenti del Liceo Scientifico Cuoco–Campanella di Napoli.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Kalam:wght@400;700&display=swap">
<style>
/*
  CONCEPT — "Il quaderno della scuola".
  Il giornale è un quaderno a quadretti: etichetta in copertina, rubriche ordinate come l'orario
  (sei ore, l'intervallo, l'uscita), titoli evidenziati, note a margine a penna, la circolare e il timbro VISTO.
  Di notte il quaderno diventa la lavagna. Niente foto di studenti: le illustrazioni sono esercizi
  di geometria disegnati dal codice (siamo uno scientifico).
  Testo in Atkinson Hyperlegible, carattere nato per la massima leggibilità.
*/
:root{
  --carta:#FAFAF6; --quadretto:#DCE5EE; --margine:#EB8C8F; --foglio:#FFFFFF; --ombra:rgba(30,35,48,.12);
  --inchiostro:#1D2230; --matita:#5A6070; --penna:#2246B4; --rossa:#CF3A30;
  --ev-giallo:#FFE45C; --ev-verde:#A8E592; --ev-azzurro:#97D7FF; --ev-rosa:#FFA9CC; --ev-arancio:#FFBF78; --ev-lilla:#CFBBFF;
  --su-ev:#1D2230; --lavagna:#24402F; --gesso:#EEF1E7; --legno:#9C6B3C;
  --f-titoli:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --f-testo:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
  --f-penna:"Kalam","Comic Sans MS","Bradley Hand",cursive;
  --riga:1.8rem; --scala:1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --carta:#1F372B; --quadretto:#2A4637; --margine:#8A5550; --foglio:#26402F; --ombra:rgba(0,0,0,.32);
  --inchiostro:#EEF1E7; --matita:#B7C4B9; --penna:#A8CAF6; --rossa:#F5A49B;
  --ev-giallo:#F3DA55; --ev-verde:#9FDB8A; --ev-azzurro:#8DCDF4; --ev-rosa:#F5A0C2; --ev-arancio:#F4B774; --ev-lilla:#C5B2F5;
  --lavagna:#172A20; --gesso:#EEF1E7; color-scheme:dark }}
:root[data-theme="dark"]{
  --carta:#1F372B; --quadretto:#2A4637; --margine:#8A5550; --foglio:#26402F; --ombra:rgba(0,0,0,.32);
  --inchiostro:#EEF1E7; --matita:#B7C4B9; --penna:#A8CAF6; --rossa:#F5A49B;
  --ev-giallo:#F3DA55; --ev-verde:#9FDB8A; --ev-azzurro:#8DCDF4; --ev-rosa:#F5A0C2; --ev-arancio:#F4B774; --ev-lilla:#C5B2F5;
  --lavagna:#172A20; --gesso:#EEF1E7; color-scheme:dark }
:root[data-size="grande"]{--scala:1.12}
:root[data-size="enorme"]{--scala:1.25}

*{box-sizing:border-box}
html{font-size:calc(100% * var(--scala))}
body{background-color:var(--carta);color:var(--inchiostro);font-family:var(--f-testo);font-size:1.0625rem;line-height:1.55;
  background-image:linear-gradient(var(--quadretto) 1px,transparent 1px),linear-gradient(90deg,var(--quadretto) 1px,transparent 1px);
  background-size:20px 20px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--carta)}
a{color:inherit}
:focus-visible{outline:3px solid var(--penna);outline-offset:3px;border-radius:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
h1,h2,h3{text-wrap:balance;margin:0;font-family:var(--f-titoli)}
p{margin:0}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.penna{font-family:var(--f-penna);color:var(--penna)}
.piccolo{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* evidenziatore: tratto irregolare dietro al testo */
.ev{--ev:var(--ev-giallo);background:linear-gradient(100deg,transparent 0 2%,var(--ev) 2% 97%,transparent 97%) 0 70%/100% 62% no-repeat;color:var(--su-ev);padding:0 .15em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ev-giallo{--ev:var(--ev-giallo)} .ev-verde{--ev:var(--ev-verde)} .ev-azzurro{--ev:var(--ev-azzurro)}
.ev-rosa{--ev:var(--ev-rosa)} .ev-arancio{--ev:var(--ev-arancio)} .ev-lilla{--ev:var(--ev-lilla)}
:root:not([data-theme="light"]) .ev{color:var(--su-ev)}

/* foglio di carta */
.foglio{position:relative;background:var(--foglio);box-shadow:0 1px 0 var(--ombra),0 6px 18px -8px var(--ombra);border-radius:3px}
.nastro::before{content:"";position:absolute;top:-11px;left:50%;width:96px;height:24px;transform:translateX(-50%) rotate(-3deg);
  background:color-mix(in srgb,var(--ev,var(--ev-giallo)) 70%,transparent);box-shadow:0 1px 2px var(--ombra)}
.righe{background-image:linear-gradient(transparent calc(var(--riga) - 1px),var(--quadretto) calc(var(--riga) - 1px));background-size:100% var(--riga);background-position:0 .55rem}
.margine-rosso::after{content:"";position:absolute;top:0;bottom:0;left:44px;width:2px;background:var(--margine);opacity:.8}
@media (max-width:600px){.margine-rosso::after{left:14px}}

/* ---------- barra di servizio ---------- */
.servizio{background:var(--carta);border-bottom:2px solid var(--inchiostro)}
.servizio .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:8px;font-size:.85rem;color:var(--matita)}
.campanella{display:flex;align-items:center;gap:7px;color:var(--inchiostro);font-weight:700}
.campanella svg{width:17px;height:17px;transform-origin:50% 10%}
.campanella.suona svg{animation:dondola .5s ease-in-out infinite alternate}
@keyframes dondola{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.azioni{margin-left:auto;display:flex;gap:4px}
.btn-ico{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:17px;font-weight:700;font-size:.85rem;color:var(--inchiostro)}
.btn-ico:hover{background:var(--quadretto)}
.btn-ico svg{width:17px;height:17px}

/* ---------- copertina: etichetta del quaderno ---------- */
.copertina{padding-block:32px 26px}
.copertina .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:22px 40px}
.etichetta{flex:1 1 560px;min-width:0;background:var(--foglio);border:2px solid var(--penna);border-radius:18px;padding:20px 26px 22px;
  box-shadow:0 0 0 6px var(--foglio),0 0 0 8px var(--penna),0 14px 30px -12px var(--ombra);margin:8px;display:grid;gap:10px;text-decoration:none}
.etichetta .riga-e{display:grid;grid-template-columns:5.2rem 1fr;align-items:end;gap:10px}
.etichetta .campo{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--matita);padding-bottom:4px}
.etichetta .valore{border-bottom:1.5px dotted var(--matita);font-family:var(--f-penna);color:var(--penna);font-size:1.25rem;line-height:1.3;min-width:0}
.etichetta .testata{font-family:var(--f-titoli);font-weight:800;font-stretch:80%;color:var(--inchiostro);font-size:clamp(2.3rem,7.4vw,4.6rem);line-height:.95;letter-spacing:-.02em;padding-bottom:6px}
.etichetta .testata .sole{color:var(--rossa)}
@media (max-width:520px){.etichetta{padding:16px 16px 18px}.etichetta .riga-e{grid-template-columns:1fr;gap:0}.etichetta .valore{font-size:1.1rem}}
.bollino{flex:0 0 auto;width:132px;height:132px;border-radius:50%;background:var(--ev-giallo);color:var(--su-ev);display:grid;place-content:center;text-align:center;
  transform:rotate(-8deg);box-shadow:0 8px 18px -8px var(--ombra);font-family:var(--f-titoli);line-height:1}
.bollino b{display:block;font-size:3rem;font-weight:800}
.bollino span{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.bollino small{font-family:var(--f-penna);font-size:.95rem;margin-top:4px}
@media (max-width:640px){.bollino{display:none}}

/* ---------- l'orario (navigazione) ---------- */
.orario{background:var(--foglio);border-block:2px solid var(--inchiostro)}
.orario ol{list-style:none;margin:0;padding:0;display:flex;overflow-x:auto;scrollbar-width:thin}
.orario li{flex:1 0 auto;border-right:1.5px solid var(--quadretto)}
.orario li:last-child{border-right:0}
.orario a{display:grid;gap:1px;padding:9px 14px 10px;text-decoration:none;white-space:nowrap;border-top:6px solid var(--ev)}
.orario a small{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--matita)}
.orario a span{font-family:var(--f-titoli);font-weight:700;font-size:1.02rem}
.orario a:hover,.orario a[aria-current="page"]{background:var(--ev);color:var(--su-ev)}
.orario a:hover small,.orario a[aria-current="page"] small{color:var(--su-ev)}
.orario a.ricreazione{background:var(--lavagna);color:var(--gesso);border-top-color:var(--legno)}
.orario a.ricreazione small{color:var(--gesso);opacity:.8}
.orario a.ricreazione span{font-family:var(--f-penna);font-weight:700}

/* ---------- prima pagina ---------- */
.prima{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:34px;padding-block:40px 30px;align-items:start}
@media (max-width:900px){.prima{grid-template-columns:1fr}}
.lead{padding:28px 28px 30px 72px;display:grid;gap:14px}
@media (max-width:600px){.lead{padding:22px 18px 24px 30px}}
.lead .figura{aspect-ratio:16/9}
.lead .segno{font-family:var(--f-penna);color:var(--rossa);font-size:1.3rem;transform:rotate(-2deg);transform-origin:left;display:inline-block}
.lead h2{font-weight:800;font-stretch:85%;font-size:clamp(2rem,4.6vw,3.3rem);line-height:1.02;letter-spacing:-.015em}
.lead h2 a{text-decoration:none}
.lead h2 a:hover{text-decoration:underline;text-decoration-color:var(--rossa);text-decoration-thickness:3px;text-underline-offset:6px}
.lead .sommario{font-size:1.18rem;color:var(--matita);max-width:58ch}
.indice{padding:24px 24px 26px;display:grid;gap:12px;--ev:var(--ev-azzurro)}
.indice h2{font-family:var(--f-penna);font-weight:700;font-size:2rem;color:var(--penna);line-height:1}
.indice ol{list-style:none;margin:0;padding:0;display:grid}
.indice li a{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1.5px dashed var(--quadretto);text-decoration:none}
.indice li a:hover .t{text-decoration:underline}
.indice .t{min-width:0}
.indice .t small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--matita)}
.indice .t b{font-weight:700;font-size:.98rem;line-height:1.3}
.indice .pag{font-family:var(--f-penna);color:var(--penna);font-size:1rem;white-space:nowrap}
.indice .nota{font-family:var(--f-penna);color:var(--rossa);font-size:1.05rem;transform:rotate(-1.5deg)}

.firma{font-size:.85rem;color:var(--matita);display:flex;flex-wrap:wrap;gap:4px 14px}
.firma b{color:var(--inchiostro)}
.kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.kicker .ev{padding:1px 6px}
.kicker .tipo{color:var(--rossa)}
.figura{display:block;width:100%;max-width:100%;border-radius:2px;background:var(--foglio)}

/* ---------- le ore (sezioni) ---------- */
.ore{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));column-gap:44px}
.ora{padding-block:34px;min-width:0}
.ora.larga{grid-column:1/-1}
.ora-testa{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:22px}
.ora-testa h2{font-weight:800;font-stretch:85%;font-size:clamp(1.8rem,3.6vw,2.4rem);line-height:1.05}
.ora-testa h2 .quale{font-family:var(--f-penna);font-weight:700;font-stretch:100%;font-size:.62em;color:var(--rossa);margin-right:8px;vertical-align:.15em}
.ora-testa p{flex:1 1 260px;color:var(--matita);font-size:.95rem}
.ora-testa a.tutti{font-weight:700;font-size:.88rem;white-space:nowrap}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:34px 28px}
.scheda{display:grid;gap:10px;align-content:start;padding:16px 16px 18px;text-decoration:none;transition:transform .15s}
.griglia > .scheda:nth-child(3n+1){transform:rotate(-.6deg)}
.griglia > .scheda:nth-child(3n+2){transform:rotate(.5deg)}
.scheda:hover{transform:rotate(0) translateY(-2px) !important}
.scheda .figura{aspect-ratio:3/2}
.scheda h3{font-weight:700;font-size:1.32rem;line-height:1.15}
.scheda:hover h3{text-decoration:underline;text-decoration-color:var(--rossa);text-decoration-thickness:2px;text-underline-offset:4px}
.scheda p.sommario{font-size:.96rem;color:var(--matita)}

/* ---------- ricreazione: la lavagna ---------- */
.ricreazione-box{background:var(--lavagna);color:var(--gesso);border:12px solid var(--legno);border-radius:6px;padding:28px clamp(18px,3vw,36px);
  display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px 40px;box-shadow:0 14px 30px -14px var(--ombra);margin-block:30px 40px}
@media (max-width:860px){.ricreazione-box{grid-template-columns:1fr}}
.ricreazione-box h2{font-family:var(--f-penna);font-weight:700;font-size:2.1rem;line-height:1.05}
.ricreazione-box .gesso-tit{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.ricreazione-box .col{display:grid;gap:12px;align-content:start}
.ricreazione-box p{font-size:1.02rem}
.ricreazione-box form{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ricreazione-box label{font-size:.88rem}
.ricreazione-box input{width:7.5em;font:700 1.1rem var(--f-penna);padding:6px 12px;border-radius:4px;border:2px dashed var(--gesso);background:transparent;color:var(--gesso)}
.btn{font-weight:700;font-size:.9rem;padding:10px 16px;border-radius:4px;background:var(--ev-giallo);color:var(--su-ev);text-decoration:none;display:inline-block}
.btn.vuoto{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.esito{font-family:var(--f-penna);font-size:1.15rem;min-height:1.5em}
.ricreazione-box details summary{cursor:pointer;font-weight:700}
.ricreazione-box details p{margin-top:6px;font-family:var(--f-penna);font-size:1.08rem}
.sapevi{border-left:3px dashed var(--gesso);padding-left:18px}
.sapevi p{font-family:var(--f-penna);font-size:1.2rem;line-height:1.45}

/* ---------- circolare in home ---------- */
.avviso{padding:26px 28px 28px 72px;display:grid;gap:12px;margin-bottom:46px;--ev:var(--ev-rosa)}
@media (max-width:600px){.avviso{padding:22px 18px 24px 30px}}
.avviso .prot{font-size:.8rem;color:var(--matita);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.avviso h2{font-weight:800;font-stretch:85%;font-size:1.8rem;line-height:1.1}
.avviso ul{margin:0;padding-left:1.2em;display:grid;gap:5px}

/* ---------- articolo ---------- */
.progresso{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:5px;background:var(--ev-giallo);width:0;z-index:20}
.articolo{display:grid;grid-template-columns:minmax(0,760px) minmax(0,1fr);gap:40px;padding-block:36px 56px;align-items:start}
@media (max-width:1040px){.articolo{grid-template-columns:minmax(0,1fr)}}
.compito{padding:34px 40px 40px 80px}
@media (max-width:600px){.compito{padding:24px 18px 30px 32px}}
.compito .testa{display:grid;gap:14px;margin-bottom:26px}
.compito h1{font-weight:800;font-stretch:85%;font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:1.02;letter-spacing:-.015em}
.compito .sommario{font-size:1.2rem;color:var(--matita)}
.compito .figura{aspect-ratio:2/1;margin-block:6px 4px}
.didascalia{font-size:.8rem;color:var(--matita)}
.corpo{font-size:1.125rem;line-height:var(--riga);display:grid;gap:var(--riga);padding-top:4px}
.corpo h3{font-size:1.3rem;line-height:var(--riga);font-weight:800;font-stretch:90%}
.corpo h3::before{content:"";display:inline-block;width:.55em;height:.55em;background:var(--ev-giallo);margin-right:.4em;border-radius:50%;vertical-align:.08em}
.corpo blockquote{margin:0;font-family:var(--f-penna);color:var(--penna);font-size:1.4rem;line-height:var(--riga);padding-left:16px;border-left:3px solid var(--penna)}
.corpo ul,.corpo ol{margin:0;padding-left:1.4em}
.corpo li{margin:0}
.corpo em{font-style:italic}
.corpo .a-margine{font-family:var(--f-penna);color:var(--penna);font-size:1.08rem;line-height:var(--riga);transform:rotate(-.8deg);max-width:46ch}
.corpo .a-margine b{color:var(--rossa)}
.corpo .a-margine::before{content:"NB → ";color:var(--rossa);font-weight:700}
.corpo .pro-contro{display:grid;grid-template-columns:1fr 1fr;gap:18px;line-height:1.55}
@media (max-width:640px){.corpo .pro-contro{grid-template-columns:1fr}}
.corpo .pro-contro > div{padding:16px 16px 18px;display:grid;gap:8px;align-content:start;font-size:1rem;background:var(--carta);border:1.5px solid var(--quadretto);border-radius:3px}
.corpo .pro-contro .etichetta{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rossa)}
.lato{display:grid;gap:30px;align-content:start}
@media (min-width:1041px){.lato{position:sticky;top:24px}}
.timbro{justify-self:start;border:3px solid var(--rossa);color:var(--rossa);border-radius:8px;padding:10px 16px 12px;transform:rotate(-5deg);display:grid;gap:4px;
  background:color-mix(in srgb,var(--foglio) 70%,transparent);max-width:290px}
.timbro b{font-family:var(--f-titoli);font-weight:800;font-size:2rem;letter-spacing:.12em;line-height:1}
.timbro span{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.4}
.postit{background:var(--ev-giallo);color:var(--su-ev);padding:20px 20px 22px;transform:rotate(1.2deg);box-shadow:0 10px 20px -10px var(--ombra);display:grid;gap:8px}
.postit h2{font-family:var(--f-penna);font-size:1.5rem;font-weight:700;line-height:1}
.postit ol{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:.88rem}
.postit a{color:var(--su-ev)}
.strumenti{display:flex;flex-wrap:wrap;gap:8px}
.altri{margin-top:var(--riga);padding-top:22px;border-top:2px dashed var(--quadretto);display:grid;gap:16px}
.altri .griglia{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:24px}
.altri .scheda{padding:12px;box-shadow:none;border:1.5px solid var(--quadretto)}
.altri .scheda h3{font-size:1.05rem}
.altri .scheda .sommario{display:none}

/* ---------- pagine istituzionali ---------- */
.pagina{padding-block:40px 60px}
.documento{max-width:820px;padding:34px 40px 40px 80px;display:grid;gap:18px}
@media (max-width:600px){.documento{padding:24px 18px 30px 32px}}
.documento .intest{text-align:center;display:grid;gap:2px;border-bottom:2px solid var(--inchiostro);padding-bottom:14px}
.documento .intest b{font-family:var(--f-titoli);font-weight:800;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase}
.documento .intest span{font-size:.85rem;color:var(--matita)}
.documento .prot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;font-size:.92rem}
.documento h1{font-weight:800;font-stretch:85%;font-size:clamp(1.9rem,4.4vw,2.8rem);line-height:1.05}
.documento .oggetto{font-size:1.05rem}
.documento .oggetto b{text-transform:uppercase;letter-spacing:.05em;font-size:.85rem;margin-right:6px}
.punto{display:grid;grid-template-columns:2.4rem 1fr;gap:10px;padding-block:10px;border-top:1.5px dashed var(--quadretto)}
.punto .n{font-family:var(--f-penna);font-weight:700;color:var(--rossa);font-size:1.6rem;line-height:1}
.punto h3{font-size:1.08rem;font-weight:800;margin-bottom:2px}
.documento ul{margin:0;padding-left:1.2em;display:grid;gap:5px}

  corpo: `
<p>Ogni mattina entriamo in una scuola che porta due nomi, e quasi nessuno di noi saprebbe dire, a bruciapelo, chi fossero. Abbiamo deciso di cominciare da qui: dai nomi.</p>
<p>Tommaso Campanella nasce a Stilo, in Calabria, nel 1568. Frate domenicano, filosofo inquieto, nel 1599 viene arrestato con l'accusa di aver organizzato una congiura contro il governo spagnolo. Passerà circa ventisette anni nelle carceri di Napoli. È lì dentro, nel 1602, che scrive <em>La Città del Sole</em>: il racconto di una città ideale, costruita su sette cerchi concentrici, con un tempio dedicato al Sole al centro.</p>
<span class="a-margine"><b>Le mura che insegnano.</b> Nella città di Campanella le pareti dei sette gironi sono dipinte con tutte le scienze: matematica, astronomia, piante, animali, arti. I ragazzi imparano camminando, prima ancora di aprire un libro.</span>
<p>Il dettaglio che ci ha conquistati è questo: in quella città il sapere non sta chiuso in una stanza, ma è dipinto sui muri, e chi passa lo vede. Un giornale scolastico, in fondo, prova a fare la stessa cosa. Per questo lo abbiamo costruito come una mattina di scuola: sei ore di lezione, dall'attualità allo sport, una ricreazione per giocare e l'uscita, dedicata a quello che ci aspetta dopo la maturità.</p>
<h3>Il giornalista che dà il nome alla scuola</h3>
<p>Vincenzo Cuoco nasce nel 1770 a Civitacampomarano, in Molise, e partecipa alla Repubblica Napoletana del 1799. Quando la repubblica cade finisce in esilio, e nel 1801 pubblica il <em>Saggio storico sulla rivoluzione napoletana</em>. La sua tesi è ancora attuale: quella rivoluzione fallì perché fu «passiva», pensata da pochi e calata dall'alto, con idee e parole lontane dalla vita della gente.</p>
<p>Pochi lo ricordano, ma Cuoco fu anche giornalista: a Milano diresse il <em>Giornale italiano</em>. Da lui prendiamo una regola semplice. Un giornale serve solo se parla la lingua di chi lo legge. Scriveremo per gli studenti, non per stupire i professori.</p>
<blockquote>Le mura di Campanella e la lezione di Cuoco: un sapere che si vede, scritto con parole che tutti capiscono.</blockquote>

  corpo: `
<p>Napoli è forse l'unica città al mondo che si chiama “nuova” da venticinque secoli. Il nome viene dal greco <em>Neápolis</em>: la fondarono, secondo la tradizione intorno al 470 a.C., i coloni greci di Cuma, accanto a un insediamento più antico, Partenope, sorto sull'altura di Pizzofalcone.</p>
<span class="a-margine"><b>Partenope</b> è il nome della sirena che, secondo il mito, si lasciò morire dopo che Ulisse resistette al suo canto. Il suo corpo sarebbe arrivato a riva proprio qui.</span>
<p>La città nuova fu progettata a tavolino, con un sistema di strade ortogonali: tre grandi vie parallele, i decumani, tagliate da vie più strette, i cardini. È uno schema che i manuali chiamano “ippodameo”, dal nome dell'architetto Ippodamo di Mileto, e lo studiamo in storia dell'arte senza accorgerci che lo percorriamo ogni giorno.</p>
<h3>L'itinerario: un'ora, tre strade</h3>

<li><b>Decumano maggiore.</b> Oggi via dei Tribunali. Sotto la chiesa di San Lorenzo Maggiore si visitano gli scavi dell'antico mercato greco-romano, con botteghe e strade lastricate.</li>
<li><b>Decumano superiore.</b> Il più stretto e silenzioso, tra via della Sapienza e via Anticaglia, dove restano gli archi del teatro romano inglobati nelle case.</li>
</ol>
<p>Dal 1995 il centro storico di Napoli è Patrimonio dell'Umanità UNESCO, proprio perché questa continuità è rara: una pianta antica che non è diventata rovina, ma è rimasta città abitata.</p>

  corpo: `
<p>Quando la terra trema a Pozzuoli, i telefoni di mezza Napoli si riempiono di messaggi inoltrati, audio di sconosciuti e previsioni che nessuno può fare. Proviamo a fare il contrario: capire cosa succede, con calma, usando le fonti giuste.</p>
<h3>Cos'è il bradisismo</h3>
<p>I Campi Flegrei sono una caldera: una grande depressione nata dal collasso del terreno dopo eruzioni molto antiche. In quest'area il suolo si alza e si abbassa lentamente, nel corso di mesi e anni. Questo movimento si chiama bradisismo, dal greco <em>bradýs</em>, “lento”. Il sollevamento è spesso accompagnato da piccoli terremoti, generalmente poco profondi.</p>
<span class="a-margine"><b>Un esempio da manuale.</b> Le colonne del Macellum di Pozzuoli, il cosiddetto “Tempio di Serapide”, portano i fori lasciati da molluschi marini: segno che in passato sono state sott'acqua e poi sono riemerse.</span>
<p>Non è un fenomeno nuovo. Il Novecento ha conosciuto due grandi crisi, nel 1970-72 e nel 1982-84, e dal 2005 è in corso una nuova fase di sollevamento, seguita giorno per giorno dai ricercatori.</p>
<h3>Chi lo misura</h3>
<p>Il monitoraggio è affidato all'Osservatorio Vesuviano, oggi sezione di Napoli dell'Istituto Nazionale di Geofisica e Vulcanologia (INGV). Fondato nel 1841, è il più antico osservatorio vulcanologico del mondo. Stazioni sismiche, GPS, misure dei gas e del suolo producono bollettini pubblici e periodici che chiunque può leggere.</p>
<h3>Cosa possiamo fare noi</h3>
<ul>
<li>Informarci solo da fonti ufficiali: INGV-Osservatorio Vesuviano, Protezione Civile, Comune.</li>
<li>Conoscere il piano di emergenza della propria zona e le aree di attesa, senza aspettare un evento.</li>
<li>Non inoltrare messaggi senza fonte: un audio allarmistico fa più danni di quanto sembri.</li>
<li>Partecipare con serietà alle prove di evacuazione della scuola.</li>
</ul>
<p>Conoscere un fenomeno naturale non lo rende innocuo, ma toglie spazio alla paura costruita sul niente. È anche il motivo per cui studiamo scienze.</p>`,

{

  corpo: `
<p>Chi dice di non aver mai chiesto aiuto a un chatbot per un compito, probabilmente non sta dicendo tutta la verità. Gli strumenti di intelligenza artificiale generativa sono ovunque. Il problema non è lo strumento: è quando smettiamo di pensare e cominciamo solo a incollare.</p>
<p>In redazione abbiamo chiesto consiglio ai due compagni che sviluppano il sito e lavorano ogni giorno con questi sistemi. Sanno bene quanto sono bravi a produrre testi credibili, e quanto facilmente sbagliano con sicurezza. Ecco le regole che la nostra redazione si è data.</p>

<span class="a-margine"><b>Prova pratica.</b> Chiedete a un assistente la biografia di un personaggio poco noto della vostra città, poi controllatela su un'enciclopedia. Contate gli errori.</span>

  sommario: "Napoli, le isole del golfo, le città che non esistono e la chimica raccontata come un romanzo. Una lista breve, da finire prima della maturità.",
  corpo: `
<p>Le liste di libri consigliati spesso sembrano compiti per le vacanze. Questa no: sono cinque titoli scelti perché parlano di luoghi che conosciamo o di domande che ci facciamo, e si leggono in pochi giorni.</p>
<h3>1. Elsa Morante, <em>L'isola di Arturo</em> (1957)</h3>
<p>Procida, un ragazzo che cresce quasi da solo e idealizza un padre sempre assente. Ha vinto il Premio Strega ed è uno dei romanzi più belli mai scritti sull'adolescenza. Leggetelo, poi prendete l'aliscafo.</p>
<h3>2. Anna Maria Ortese, <em>Il mare non bagna Napoli</em> (1953)</h3>
<p>Racconti e reportage su una Napoli del dopoguerra lontana dalle cartoline. Un libro scomodo, che fece discutere molto. Utile per capire quanto il modo di raccontare una città cambi la città stessa.</p>
<h3>3. Italo Calvino, <em>Le città invisibili</em> (1972)</h3>
<p>Marco Polo descrive a Kublai Khan città che forse non esistono. Ogni capitolo dura poche pagine. È il compagno perfetto della Città del Sole di Campanella: due modi di immaginare il luogo in cui vorremmo vivere.</p>
<span class="a-margine"><b>Collegamento per l'orale.</b> Utopie a confronto: Campanella, Moro, Calvino. Funziona in italiano, filosofia e storia dell'arte.</span>
<h3>4. Erri De Luca, <em>Montedidio</em> (2001)</h3>

      <details><summary>La soluzione</summary><p>${esc(PROBLEMA.soluzione)}</p></details>
    </div>
    <div class="col sapevi">
      <span class="gesso-tit">Lo sapevi?</span>
      ${CURIOSITA.map(t => `<p>${esc(t)}</p>`).join("")}
    </div>
  </section>`;
}

/* ---------- viste ---------- */
function home() {
  const lead = ARTICOLI.find(a => a.apertura) || ARTICOLI[0];
  const lo = rubricaDi(lead.rubrica);
  const ore = ORE.filter(o => !o.ricreazione).map(o => {
    const lista = ARTICOLI.filter(a => a.rubrica === o.id && a !== lead);
    if (!lista.length) return "";
    return `<section class="ora${lista.length > 1 ? " larga" : ""}" aria-labelledby="o-${o.id}">
      <div class="ora-testa"><h2 id="o-${o.id}"><span class="quale">${esc(o.ora)}</span><span class="ev ev-${o.colore}">${esc(o.nome)}</span></h2>
        <p>${esc(o.tema)} · ${esc(o.descr)}</p><a class="tutti" href="#rubrica-${o.id}">Tutta la ${esc(o.ora)} →</a></div>
      <div class="griglia">${lista.map(scheda).join("")}</div></section>`;
  }).join("");
  return `
  <section class="prima" aria-label="In prima pagina">
    <article class="lead foglio righe margine-rosso">
      <span class="segno">In prima pagina!</span>
      <a href="#a-${lead.slug}" tabindex="-1" aria-hidden="true">${figura(lead.slug, lo)}</a>
      ${kicker(lead)}
      <h2><a href="#a-${lead.slug}">${esc(lead.titolo)}</a></h2>
      <p class="sommario">${esc(lead.sommario)}</p>
      ${firmaRiga(lead)}
    </article>
    <aside class="indice foglio nastro" aria-label="Indice del numero">
      <h2>Indice</h2>
      <ol>${ARTICOLI.map(a => { const o = rubricaDi(a.rubrica); return `<li><a href="#a-${a.slug}"><span class="t"><small>${esc(o.ora)} · ${esc(o.nome)}</small><b>${esc(a.titolo)}</b></span><span class="pag">pag. ${pagina(a)}</span></a></li>`; }).join("")}
        <li><a href="#ricreazione"><span class="t"><small>Ricreazione</small><b>${esc(PROBLEMA.titolo)}</b></span><span class="pag">pag. ${ARTICOLI.length + 2}</span></a></li></ol>
      <p class="nota">tempo di lettura totale: ${ARTICOLI.reduce((s, a) => s + minuti(a), 0)} minuti, meno di un'ora di lezione</p>
    </aside>
  </section>
  <div class="ore">${ore}</div>
  ${ricreazioneHTML()}
  <section class="avviso foglio righe margine-rosso nastro" aria-label="Circolare della redazione">
    <span class="prot">Circolare n. 1 · Oggetto: cosa non troverete mai su questo giornale</span>
    <h2>Le regole che ci siamo dati</h2>
    <ul>
      <li>Nomi, cognomi e classi di studenti: firmiamo con le iniziali.</li>
      <li>Foto o video di studenti senza il consenso scritto delle famiglie.</li>
      <li>Voti, verifiche, ritardi, note disciplinari, dati sulla salute.</li>
      <li>Titoli costruiti per spaventare o creare allarme.</li>
      <li>Notizie senza fonti: le trovate accanto a ogni articolo.</li>
    </ul>
    <a class="btn vuoto" href="#circolare" style="justify-self:start">Leggi la circolare completa</a>
  </section>`;
}

function rubrica(id) {
  const o = rubricaDi(id); if (!o) return nonTrovato();
  if (o.ricreazione) return `<div class="pagina">${ricreazioneHTML()}</div>`;
  const lista = ARTICOLI.filter(a => a.rubrica === id);
  return `<section class="ora" style="padding-top:40px">
    <div class="ora-testa"><h2 style="font-size:clamp(2.2rem,5vw,3.2rem)"><span class="quale">${esc(o.ora)}</span><span class="ev ev-${o.colore}">${esc(o.nome)}</span></h2><p>${esc(o.tema)} · ${esc(o.descr)}</p></div>
    ${lista.length ? `<div class="griglia">${lista.map(scheda).join("")}</div>` :
      `<p class="penna" style="font-size:1.3rem">Quest'ora è ancora libera. Il primo articolo potrebbe essere il tuo: <a href="#redazione">ecco come proporlo</a>.</p>`}
  </section>`;
}

function articolo(slug) {
  const a = ARTICOLI.find(x => x.slug === slug); if (!a) return nonTrovato();
  const o = rubricaDi(a.rubrica);
  const altri = ARTICOLI.filter(x => x !== a && x.rubrica === a.rubrica).concat(ARTICOLI.filter(x => x !== a && x.rubrica !== a.rubrica)).slice(0, 3);
  return `<div class="articolo">
    <article class="compito foglio righe margine-rosso">
      <header class="testa">${kicker(a)}<h1>${esc(a.titolo)}</h1><p class="sommario">${esc(a.sommario)}</p>${firmaRiga(a)}
        <figure style="margin:0">${figura(a.slug, o)}<figcaption class="didascalia">Illustrazione disegnata dal codice del sito: un esercizio di geometria, nessuna foto di persone.</figcaption></figure>
      </header>
      <div class="corpo">${a.corpo}</div>
      <div class="altri"><span class="penna" style="font-size:1.3rem">Leggi anche…</span><div class="griglia">${altri.map(scheda).join("")}</div></div>
    </article>
    <aside class="lato" aria-label="Informazioni sull'articolo">
      <div class="timbro"><b>VISTO</b><span>Controllato dalla redazione</span><span>✓ nessun dato personale · ✓ nessuna foto di minori · ✓ fonti citate · ✓ niente allarmismi</span></div>
      <div class="postit"><h2>Fonti</h2><ol>${a.fonti.map(([t, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("")}</ol></div>
      <div class="strumenti">
        <button class="btn vuoto" id="copia-link" type="button">Copia il link</button>
        <a class="btn vuoto" href="#rubrica-${o.id}">${esc(o.ora)} · ${esc(o.nome)}</a>
      </div>
      <p id="copia-esito" style="font-size:.82rem;color:var(--matita)" aria-live="polite"></p>
    </aside>
  </div>`;
}

const intestazione = () => `<div class="intest"><b>${esc(GIORNALE.scuola)}</b><span>${esc(GIORNALE.citta)} · Redazione del giornale «La Città del Sole»</span></div>`;

function circolare() {
  const regole = [
    ["Niente dati che identificano", "Non pubblichiamo nome e cognome, classe, ritardi, problemi disciplinari o situazioni personali di studenti. Gli autori firmano con le iniziali; il nome completo compare solo con liberatoria scritta."],
    ["Foto e video solo con consenso", "Immagini di studenti solo con consenso informato dei genitori, o dell'interessato se maggiorenne. Per scelta il sito usa illustrazioni disegnate dal codice, senza volti."],
    ["Voti e valutazioni restano privati", "Risultati di verifiche, voti e giudizi si comunicano solo con i canali riservati della scuola, mai qui."],
    ["Nessun dato sensibile", "Diagnosi, salute, informazioni personali particolari non vengono divulgate in alcun modo, neppure in forma indiretta."],
    ["Niente allarmismo", "Non pubblichiamo contenuti che generano paura ingiustificata sulla scuola o sui minori, né immagini di ragazzi in contesti che suggeriscono pericolo. Sui temi delicati citiamo solo fonti ufficiali."],
    ["Fonti dichiarate", "Ogni articolo elenca le sue fonti. Se troviamo un errore lo correggiamo e lo segnaliamo."],
    ["Pubblicazione autorizzata", "Ogni numero è rivisto dalla docente referente e pubblicato sotto la responsabilità del Dirigente scolastico, che ne garantisce il rispetto della normativa sulla privacy."]
  ];
  return `<div class="pagina"><div class="documento foglio righe margine-rosso">
    ${intestazione()}
    <div class="prot"><span>Circolare n. 1</span><span>${esc(GIORNALE.citta)}, ${esc(GIORNALE.mese.toLowerCase())}</span></div>
    <p>Agli studenti, ai docenti, alle famiglie</p>
    <p class="oggetto"><b>Oggetto:</b>regole per scrivere e pubblicare sul giornale della scuola.</p>
    <h1>Circolare della redazione</h1>
    <p>Queste regole vengono dalle indicazioni della nostra docente sulle pubblicazioni online delle scuole. Servono a proteggere la privacy dei minori, prevenire il cyberbullismo e mantenere un ambiente sereno.</p>
    <div>${regole.map(([t, d], i) => `<div class="punto"><span class="n">${i + 1}.</span><div><h3>${t}</h3><p>${d}</p></div></div>`).join("")}</div>
    <h3 style="font-size:1.1rem">Cosa possiamo pubblicare</h3>
    <ul><li>Articoli, interviste e approfondimenti senza dati personali identificativi.</li>
      <li>Racconti di attività, eventi e progetti della scuola, nel rispetto della riservatezza.</li>
      <li>Materiali didattici e informazioni generali non riconducibili a singoli studenti.</li></ul>
    <div class="firme"><span class="f">La Redazione<small>firma</small></span><div class="timbro"><b>VISTO</b><span>la docente referente</span></div></div>
  </div></div>`;
}

function redazione() {
  const colori = ["giallo", "rosa", "azzurro", "verde"];
  return `<div class="pagina"><div class="documento foglio righe margine-rosso">
    <span class="penna" style="font-size:1.3rem;color:var(--rossa)">Chi siamo</span>
    <h1>La redazione</h1>
    <p>Quattro studenti di quinta del ${esc(GIORNALE.scuola)}, ${esc(GIORNALE.citta)}. Due scrivono gli articoli, due costruiscono e pubblicano il sito. Firmiamo con le iniziali, come prevede la nostra circolare.</p>
    <div class="membri">${REDAZIONE.map((m, i) => `<div class="membro" style="--ev:var(--ev-${colori[i % 4]})"><div class="ciao">Ciao, sono</div><div class="dentro"><span class="sigla">${esc(GIORNALE.mostraNomiCompleti ? m.nome : m.sigla)}</span><span class="ruolo">${esc(m.ruolo)}</span>${m.rubriche ? `<span class="ruolo">Rubriche: ${esc(m.rubriche)}</span>` : ""}</div></div>`).join("")}</div>
    <h3 style="font-size:1.1rem;margin-top:10px">Come proporre un articolo</h3>
    <ol class="passi">
      <li>Scegli l'ora giusta (la rubrica) e scrivi un titolo e due righe di sommario.</li>
      <li>Scrivi il pezzo: da 2.000 a 5.000 battute, con l'elenco delle fonti in fondo.</li>
      <li>Rileggi con la circolare davanti: niente nomi, foto, voti o dati di compagni.</li>
      <li>Consegnalo alla redazione o a ${esc(GIORNALE.referente)}: lo rivediamo insieme e lo firmi con le iniziali.</li>
    </ol>
    <p><b>Quando esce:</b> un numero al mese durante l'anno scolastico. Numero ${GIORNALE.numero}: ${esc(GIORNALE.mese)}. Prossimo numero: ${esc(GIORNALE.prossimo)}.</p>
  </div></div>`;
}

function nonTrovato() { return `<div class="pagina"><div class="documento foglio righe margine-rosso"><h1>Pagina strappata</h1><p>Questa pagina non esiste o è stata spostata. <a href="#">Torna alla prima pagina</a>.</p></div></div>`; }

/* ---------- router: #a-slug, #rubrica-id, #circolare, #redazione ---------- */
function render() {
  const h = decodeURIComponent(location.hash.slice(1));
  let html, attivo = null, isArt = false;
  if (!h) html = home();
  else if (h === "ricreazione") { html = home(); }
  else if (h.startsWith("a-")) { const a = ARTICOLI.find(x => x.slug === h.slice(2)); html = articolo(h.slice(2)); isArt = !!a; attivo = a && a.rubrica; }
  else if (h.startsWith("rubrica-")) { attivo = h.slice(8); html = rubrica(attivo); }
  else if (h === "circolare") html = circolare();
  else if (h === "redazione") html = redazione();
  else html = nonTrovato();
  vista.innerHTML = html;
  document.querySelectorAll("#nav-ore a").forEach(a => { if (a.dataset.id === attivo) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  $("#progresso").hidden = !isArt;
  const art = isArt && ARTICOLI.find(x => x.slug === h.slice(2));
  document.title = art ? `${art.titolo} · La Città del Sole` : "La Città del Sole";
  if (h === "ricreazione") requestAnimationFrame(() => $("#ricreazione")?.scrollIntoView()); else window.scrollTo(0, 0);
  requestAnimationFrame(disegnaTutte);
  collega();
}

function collega() {
  const f = $("#form-problema");
  if (f) f.addEventListener("submit", e => {
    e.preventDefault();
    const v = parseFloat($("#risposta").value.replace(",", ".").replace("°", ""));
    const out = $("#esito");
    if (isNaN(v)) { out.textContent = "Scrivi un numero, per esempio 30,5."; return; }
    out.textContent = Math.abs(v - PROBLEMA.risposta) <= PROBLEMA.tolleranza ? "Giusto! Dieci e lode (ma non lo scriviamo sul registro)." : "Quasi… prova con l'aiutino.";
  });
  const cp = $("#copia-link");
  if (cp) cp.addEventListener("click", () => {
    const url = location.href, out = $("#copia-esito");
    if (!navigator.clipboard) { out.textContent = url; return; }
    navigator.clipboard.writeText(url).then(() => { out.textContent = "Link copiato."; }).catch(() => { out.textContent = url; });
  });
}

/* ---------- campanella ---------- */
function campanella() {
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes(), g = d.getDay();
  const el = $("#campanella"), t = $("#campanella-txt"); let txt, suona = false;
  if (g === 0 || g === 6) txt = "Oggi niente scuola. Buona lettura!";
  else if (m < 480) txt = `Prima campanella alle 8:00 (tra ${480 - m} min)`;
  else if (m >= 840) txt = "Lezioni finite. Buona lettura!";
  else { const ora = Math.floor((m - 480) / 60) + 1, resto = 60 - ((m - 480) % 60); suona = resto <= 3; txt = `${ora}ª ora · campanella tra ${resto} min`; }
  t.textContent = txt; el.classList.toggle("suona", suona);
}

/* ---------- impianto ---------- */
function impianto() {
  const d = new Date();
  $("#oggi").textContent = `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`;
  $("#e-scuola").textContent = `${GIORNALE.scuola} · ${GIORNALE.citta}`;
  $("#e-anno").textContent = `a.s. ${GIORNALE.annoScolastico} · numero ${GIORNALE.numero} · ${GIORNALE.mese}`;
  $("#bollino").innerHTML = `<span>numero</span><b>${GIORNALE.numero}</b><small>${esc(GIORNALE.mese.split(" ")[0].toLowerCase())}</small>`;
  $("#nav-ore").innerHTML = ORE.map(o => `<li><a href="#${o.ricreazione ? "rubrica-" + o.id : "rubrica-" + o.id}" data-id="${o.id}" class="${o.ricreazione ? "ricreazione" : ""}" style="--ev:var(--ev-${o.colore})"><small>${esc(o.ora)}</small><span>${esc(o.nome)}</span></a></li>`).join("");
  $("#retro").innerHTML = `
    <div><h4>La Città del Sole</h4><p>Giornale scolastico online del ${esc(GIORNALE.scuola)}, ${esc(GIORNALE.citta)}. Anno scolastico ${esc(GIORNALE.annoScolastico)}, numero ${GIORNALE.numero}. Ogni numero è rivisto dalla docente referente e pubblicato sotto la responsabilità del Dirigente scolastico.</p></div>
    <div><h4>L'orario</h4><ul>${ORE.map(o => `<li><a href="#rubrica-${o.id}">${esc(o.ora)} · ${esc(o.nome)}</a></li>`).join("")}</ul></div>
    <div><h4>La redazione</h4><ul><li><a href="#redazione">Chi siamo e come scriverci</a></li><li><a href="#circolare">Circolare n. 1: regole e privacy</a></li></ul>
      <p style="margin-top:10px">Nessuna foto di studenti: le illustrazioni sono esercizi di geometria disegnati dal codice, diversi per ogni articolo.</p></div>
    <div><h4>Retro di copertina</h4><div class="formulario"><span>sen 30°</span><span>= 1/2</span><span>cos 60°</span><span>= 1/2</span><span>sen 45°</span><span>= √2/2</span><span>sen²x + cos²x</span><span>= 1</span><span>π</span><span>≈ 3,14159</span></div></div>`;

  const root = document.documentElement;
  const tema = store.get("cds-tema"); if (tema) root.dataset.theme = tema;
  const isScuro = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const etichettaTema = () => { $("#tema-txt").textContent = isScuro() ? "Quaderno" : "Lavagna"; };
  etichettaTema();
  $("#btn-tema").addEventListener("click", () => { const n = isScuro() ? "light" : "dark"; root.dataset.theme = n; store.set("cds-tema", n); etichettaTema(); disegnaTutte(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { etichettaTema(); disegnaTutte(); });

  const taglie = ["", "grande", "enorme"]; let ti = Math.max(0, taglie.indexOf(store.get("cds-taglia") || ""));
  const applica = () => { if (taglie[ti]) root.dataset.size = taglie[ti]; else delete root.dataset.size; };
  applica();
  $("#btn-testo").addEventListener("click", () => { ti = (ti + 1) % taglie.length; applica(); store.set("cds-taglia", taglie[ti]); requestAnimationFrame(disegnaTutte); });

  const pannello = $("#ricerca"), q = $("#q"), ris = $("#risultati"), bc = $("#btn-cerca");
  bc.addEventListener("click", () => { pannello.hidden = !pannello.hidden; bc.setAttribute("aria-expanded", String(!pannello.hidden)); if (!pannello.hidden) q.focus(); });
  q.addEventListener("input", () => {
    const s = q.value.trim().toLowerCase();
    if (s.length < 2) { ris.innerHTML = ""; return; }
    const trovati = ARTICOLI.filter(a => (a.titolo + " " + a.sommario + " " + a.corpo.replace(/<[^>]+>/g, " ")).toLowerCase().includes(s));
    ris.innerHTML = trovati.length ? trovati.map(a => `<li><a href="#a-${a.slug}"><small>${esc(rubricaDi(a.rubrica).nome)}</small>${esc(a.titolo)}</a></li>`).join("") : `<li class="penna" style="padding:8px 4px">Nessun articolo contiene “${esc(q.value)}”.</li>`;
  });
  ris.addEventListener("click", e => { if (e.target.closest("a")) { pannello.hidden = true; bc.setAttribute("aria-expanded", "false"); } });

  addEventListener("scroll", () => { const p = $("#progresso"); if (p.hidden) return; const h = document.documentElement.scrollHeight - innerHeight; p.style.width = (h > 0 ? scrollY / h * 100 : 0) + "%"; }, { passive: true });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(disegnaTutte, 120); });
  document.fonts?.ready.then(disegnaTutte);
  addEventListener("hashchange", render);
  campanella(); setInterval(campanella, 30000);
  render();
}
impianto();
</script>
