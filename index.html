<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Città del Sole</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="La Città del Sole, giornale degli studenti del Liceo Scientifico Cuoco–Campanella di Napoli.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=Schibsted+Grotesk:wght@400..800&display=swap">
<style>
/*
  CONCEPT — "La pianta della città".
  Nella Città del Sole di Campanella i sette gironi concentrici hanno le mura dipinte con tutte le scienze:
  si impara camminando. Il giornale è una città: sette cerchi = sette rubriche, il Sole al centro = il numero in uscita.
  Ornamento solo generativo (maioliche napoletane disegnate dal codice): zero foto di studenti, per scelta di privacy.
  Inchiostro blu oltremare al posto del nero; il giallo-sole è l'unico gesto forte.
*/
:root{
  --carta:#F5F6F1; --carta-2:#ECEEE6; --inchiostro:#15213D; --inchiostro-2:#4B5672; --filo:#D5D9CD;
  --sole:#EFB320; --su-sole:#15213D; --maiolica:#1E7558; --cielo:#2A5BA8;
  --anello:#E4E8DD; --anello-2:#D9E1E8;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-testo:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --scala:1;
  --misura:66ch;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --carta:#0E1628; --carta-2:#141E35; --inchiostro:#E8EBF2; --inchiostro-2:#A6AFC3; --filo:#273350;
  --sole:#F4C14B; --su-sole:#15213D; --maiolica:#4DB389; --cielo:#83A9EA;
  --anello:#17213A; --anello-2:#1C2946; color-scheme:dark }}
:root[data-theme="dark"]{
  --carta:#0E1628; --carta-2:#141E35; --inchiostro:#E8EBF2; --inchiostro-2:#A6AFC3; --filo:#273350;
  --sole:#F4C14B; --su-sole:#15213D; --maiolica:#4DB389; --cielo:#83A9EA;
  --anello:#17213A; --anello-2:#1C2946; color-scheme:dark }
:root[data-size="grande"]{--scala:1.12}
:root[data-size="enorme"]{--scala:1.25}

*{box-sizing:border-box}
html{font-size:calc(100% * var(--scala))}
body{background:var(--carta);color:var(--inchiostro);font-family:var(--f-testo);font-size:1.0625rem;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--carta)}
a{color:inherit}
:focus-visible{outline:3px solid var(--cielo);outline-offset:3px;border-radius:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui{font-family:var(--f-ui)}
.etichetta{font-family:var(--f-ui);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}

/* ---------- barra di servizio ---------- */
.servizio{border-bottom:1px solid var(--filo)}
.servizio .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px;font-family:var(--f-ui);font-size:.82rem;color:var(--inchiostro-2)}
.servizio .data{font-variant-numeric:tabular-nums}
.campanella{display:flex;align-items:center;gap:8px;color:var(--inchiostro)}
.campanella svg{width:16px;height:16px;transform-origin:50% 10%}
.campanella.suona svg{animation:dondola .6s ease-in-out infinite alternate}
@keyframes dondola{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.servizio .azioni{margin-left:auto;display:flex;gap:4px}
.btn-ico{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 10px;border-radius:16px;font-family:var(--f-ui);font-size:.8rem;font-weight:600;color:var(--inchiostro)}
.btn-ico:hover{background:var(--carta-2)}
.btn-ico svg{width:16px;height:16px}

/* ---------- testata ---------- */
.testata{padding-block:28px 18px}
.testata .wrap{display:grid;grid-template-columns:1fr auto;align-items:end;gap:16px 32px}
.testata a{text-decoration:none}
.nome{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(2.6rem,9vw,6.4rem);line-height:.88;letter-spacing:-.025em;font-variation-settings:"opsz" 96}
.nome b{font-style:normal;font-weight:800}
.sottotesta{margin-top:12px;font-family:var(--f-ui);font-size:.9rem;color:var(--inchiostro-2);max-width:46ch}
.numero-box{text-align:right;font-family:var(--f-ui);font-size:.8rem;line-height:1.35;color:var(--inchiostro-2)}
.numero-box strong{display:block;white-space:nowrap;font-family:var(--f-display);font-size:2.4rem;line-height:1;color:var(--inchiostro);font-weight:700;font-variant-numeric:lining-nums}
@media (max-width:640px){.testata .wrap{grid-template-columns:1fr}.numero-box{text-align:left;display:flex;gap:10px;align-items:baseline}.numero-box strong{font-size:1.6rem}}

/* ---------- navigazione: i sette cerchi ---------- */
.cerchi{border-block:1px solid var(--inchiostro)}
.cerchi ol{list-style:none;margin:0;padding:0;display:flex;overflow-x:auto;scrollbar-width:none}
.cerchi ol::-webkit-scrollbar{display:none}
.cerchi li{flex:1 0 auto}
.cerchi a{display:flex;align-items:baseline;gap:7px;padding:12px 14px;text-decoration:none;font-family:var(--f-ui);font-size:.88rem;font-weight:600;white-space:nowrap;border-right:1px solid var(--filo)}
.cerchi li:last-child a{border-right:0}
.cerchi a span{font-family:var(--f-display);font-weight:700;color:var(--inchiostro-2);font-size:.95rem}
.cerchi a:hover,.cerchi a[aria-current="page"]{background:var(--sole);color:var(--su-sole)}
.cerchi a:hover span,.cerchi a[aria-current="page"] span{color:var(--su-sole)}

/* ---------- home: apertura ---------- */
.apertura{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;padding-block:36px 44px;border-bottom:1px solid var(--filo)}
@media (max-width:900px){.apertura{grid-template-columns:1fr}}
.lead{display:grid;gap:16px;align-content:start}
.lead .tavola{aspect-ratio:16/9}
.lead h2{font-family:var(--f-display);font-weight:600;font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.02;letter-spacing:-.015em}
.lead h2 a{text-decoration:none}
.lead h2 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.lead .sommario{font-size:1.2rem;line-height:1.5;color:var(--inchiostro-2);max-width:56ch}
.occhiello{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;color:var(--maiolica)}
.occhiello .num{color:var(--inchiostro-2)}
.firma{font-family:var(--f-ui);font-size:.82rem;color:var(--inchiostro-2);display:flex;flex-wrap:wrap;gap:4px 14px}
.firma b{color:var(--inchiostro);font-weight:600}

.pianta{display:grid;gap:14px;align-content:start}
.pianta svg{width:100%;max-width:440px;height:auto;margin-inline:auto;display:block}
.pianta .anello{fill:none;stroke-width:21;cursor:pointer;transition:stroke .15s}
.pianta .anello.a1{stroke:var(--anello)} .pianta .anello.a2{stroke:var(--anello-2)}
.pianta g.cerchio text{font-family:var(--f-ui);font-size:9.5px;font-weight:700;letter-spacing:.14em;fill:var(--inchiostro);pointer-events:none;text-transform:uppercase}
.pianta g.cerchio:hover .anello,.pianta g.cerchio:focus .anello{stroke:var(--sole)}
.pianta g.cerchio:hover text,.pianta g.cerchio:focus text{fill:var(--su-sole)}
.pianta g.cerchio{outline:none}
.pianta .raggio{stroke:var(--sole);stroke-width:2.2;stroke-linecap:round}
.pianta .disco{fill:var(--sole)}
.pianta .disco-txt{font-family:var(--f-display);font-weight:800;fill:var(--su-sole);font-size:22px}
.pianta .disco-sub{font-family:var(--f-ui);font-weight:700;fill:var(--su-sole);font-size:6.5px;letter-spacing:.18em}
.pianta figcaption{font-family:var(--f-ui);font-size:.82rem;color:var(--inchiostro-2);text-align:center;max-width:40ch;margin-inline:auto}
.pianta figure{margin:0;display:grid;gap:12px}

/* ---------- tavole maiolica (generative) ---------- */
.tavola{display:block;width:100%;max-width:100%;background:var(--carta-2);border-radius:2px}

/* ---------- fasce dei cerchi ---------- */
.fascia{padding-block:40px;border-bottom:1px solid var(--filo);min-width:0}
.fasce{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));column-gap:48px}
.fascia.larga{grid-column:1/-1}
.fascia-testa{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:6px 18px;margin-bottom:24px}
.fascia-testa .romano{font-family:var(--f-display);font-weight:800;font-size:3.6rem;line-height:.8;color:var(--sole);-webkit-text-stroke:0}
.fascia-testa h2{font-family:var(--f-display);font-weight:600;font-size:1.9rem;line-height:1}
.fascia-testa p{font-family:var(--f-ui);font-size:.88rem;color:var(--inchiostro-2);margin-top:6px}
.fascia-testa a.tutti{font-family:var(--f-ui);font-size:.82rem;font-weight:600;white-space:nowrap}
@media (max-width:560px){.fascia-testa{grid-template-columns:auto 1fr}.fascia-testa a.tutti{grid-column:1/-1}}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:32px 28px}
.scheda{display:grid;gap:10px;align-content:start;text-decoration:none}
.scheda .tavola{aspect-ratio:3/2}
.scheda h3{font-family:var(--f-display);font-weight:600;font-size:1.45rem;line-height:1.1}
.scheda:hover h3{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.scheda p.sommario{font-size:.98rem;color:var(--inchiostro-2);line-height:1.5}

/* ---------- moduli in home ---------- */
.moduli{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;padding-block:44px}
@media (max-width:860px){.moduli{grid-template-columns:1fr}}
.problema{background:var(--inchiostro);color:var(--carta);padding:28px;display:grid;gap:14px;align-content:start;border-radius:2px}
.problema .etichetta{color:var(--sole)}
.problema h2{font-family:var(--f-display);font-weight:600;font-size:1.7rem;line-height:1.1}
.problema p{color:var(--carta);opacity:.9}
.problema form{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.problema label{font-family:var(--f-ui);font-size:.85rem}
.problema input{width:7.5em;font:600 1.05rem var(--f-ui);padding:9px 12px;border-radius:2px;border:2px solid var(--carta);background:transparent;color:var(--carta)}
.btn{font-family:var(--f-ui);font-weight:700;font-size:.88rem;padding:10px 16px;border-radius:2px;background:var(--sole);color:var(--su-sole)}
.btn.vuoto{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.problema .esito{font-family:var(--f-ui);font-size:.92rem;min-height:1.4em}
.problema details{font-size:.95rem}
.problema summary{font-family:var(--f-ui);font-weight:600;cursor:pointer}
.problema details p{margin-top:8px}
.carta-box{border:1.5px solid var(--inchiostro);padding:26px;display:grid;gap:14px;align-content:start}
.carta-box h2{font-family:var(--f-display);font-weight:600;font-size:1.7rem;line-height:1.1}
.carta-box ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-family:var(--f-ui);font-size:.92rem}
.carta-box li{display:grid;grid-template-columns:18px 1fr;gap:10px}
.carta-box li::before{content:"";width:10px;height:10px;margin-top:6px;background:var(--maiolica);transform:rotate(45deg)}

/* ---------- articolo ---------- */
.progresso{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:4px;background:var(--sole);width:0;z-index:20;transition:width .08s linear}
.articolo{padding-block:36px 56px}
.art-testa{max-width:860px;display:grid;gap:16px}
.art-testa h1{font-family:var(--f-display);font-weight:600;font-size:clamp(2.2rem,5.6vw,4.2rem);line-height:1;letter-spacing:-.02em}
.art-testa .sommario{font-size:1.25rem;line-height:1.5;color:var(--inchiostro-2);max-width:60ch}
.art-tavola{margin-block:28px 8px}
.art-tavola .tavola{aspect-ratio:21/8}
.art-tavola figcaption{font-family:var(--f-ui);font-size:.75rem;color:var(--inchiostro-2);margin-top:8px}
.art-corpo-wrap{display:grid;grid-template-columns:minmax(0,var(--misura)) minmax(0,1fr);gap:56px;margin-top:28px}
@media (max-width:1000px){.art-corpo-wrap{grid-template-columns:minmax(0,1fr)}}
.corpo{font-size:1.14rem;line-height:1.72;display:grid;gap:1.05em;max-width:var(--misura)}
.corpo h3{font-family:var(--f-ui);font-size:1rem;font-weight:800;letter-spacing:.02em;margin-top:.8em}
.corpo blockquote{margin:.4em 0;padding:0 0 0 22px;border-left:4px solid var(--sole);font-family:var(--f-display);font-style:italic;font-size:1.45rem;line-height:1.3}
.corpo ul,.corpo ol{margin:0;padding-left:1.3em;display:grid;gap:.4em}
.corpo .a-margine{font-family:var(--f-ui);font-size:.86rem;line-height:1.5;color:var(--inchiostro-2);border-top:2px solid var(--maiolica);padding-top:10px}
.corpo .a-margine b{color:var(--inchiostro)}
@media (min-width:700px){.corpo .a-margine{margin-left:2.2rem;max-width:44ch}}
.corpo .pro-contro{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:640px){.corpo .pro-contro{grid-template-columns:1fr}}
.corpo .pro-contro > div{background:var(--carta-2);padding:18px;display:grid;gap:8px;align-content:start;font-size:1rem;line-height:1.55}
.corpo .pro-contro .etichetta{color:var(--maiolica)}
.colonna-lat{display:grid;gap:22px;align-content:start}
@media (min-width:1001px){.colonna-lat{position:sticky;top:24px}}
.garanzie{border:1.5px solid var(--inchiostro);padding:18px;display:grid;gap:10px;font-family:var(--f-ui);font-size:.86rem}
.garanzie ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.garanzie li::before{content:"✓ ";color:var(--maiolica);font-weight:800}
.fonti{display:grid;gap:10px;font-family:var(--f-ui);font-size:.86rem}
.fonti ol{margin:0;padding-left:1.2em;display:grid;gap:6px;color:var(--inchiostro-2)}
.fonti a{color:var(--cielo)}
.strumenti{display:flex;flex-wrap:wrap;gap:8px}
.art-piede{max-width:var(--misura);margin-top:44px;padding-top:22px;border-top:1px solid var(--inchiostro);display:grid;gap:18px}
.altri{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:22px}
.altri .scheda h3{font-size:1.2rem}

/* ---------- pagine istituzionali ---------- */
.pagina{padding-block:40px 60px;max-width:820px}
.pagina h1{font-family:var(--f-display);font-weight:600;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1;margin-bottom:12px}
.pagina .intro{font-size:1.2rem;color:var(--inchiostro-2);max-width:60ch}
.pagina section{margin-top:34px;display:grid;gap:12px}
.pagina h2{font-family:var(--f-ui);font-size:1.05rem;font-weight:800}
.pagina ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.regola{display:grid;grid-template-columns:3rem 1fr;gap:14px;padding-block:14px;border-top:1px solid var(--filo)}
.regola .n{font-family:var(--f-display);font-weight:800;font-size:1.8rem;line-height:1;color:var(--sole)}
.regola h3{font-family:var(--f-ui);font-size:1rem;font-weight:800;margin-bottom:4px}
.membri{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:16px}
.membro{border-top:4px solid var(--inchiostro);padding-top:12px;display:grid;gap:4px}
.membro .sigla{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1}
.membro .ruolo{font-family:var(--f-ui);font-size:.86rem;color:var(--inchiostro-2)}
.passi{counter-reset:p;list-style:none;padding:0 !important}
.passi li{counter-increment:p;display:grid;grid-template-columns:2rem 1fr;gap:10px}
.passi li::before{content:counter(p);font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--maiolica)}

/* ---------- ricerca ---------- */
.ricerca{border-bottom:1px solid var(--filo);background:var(--carta-2)}
.ricerca .wrap{padding-block:16px;display:grid;gap:12px}
.ricerca input{width:100%;font:500 1.15rem var(--f-ui);padding:12px 14px;border:1.5px solid var(--inchiostro);background:var(--carta);color:var(--inchiostro);border-radius:2px}
.ricerca ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ricerca li a{display:block;padding:8px 4px;text-decoration:none;font-family:var(--f-display);font-size:1.15rem;font-weight:600}
.ricerca li a small{font-family:var(--f-ui);font-size:.75rem;color:var(--maiolica);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-right:8px}
.ricerca li a:hover{background:var(--sole);color:var(--su-sole)}

/* ---------- colophon ---------- */
.colophon{border-top:1px solid var(--inchiostro);margin-top:12px}
.colophon .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:24px;padding-block:32px 40px;font-family:var(--f-ui);font-size:.84rem;color:var(--inchiostro-2)}
.colophon h4{font-family:var(--f-display);font-size:1.25rem;color:var(--inchiostro);margin:0 0 6px;font-style:italic;font-weight:600}
.colophon a{color:var(--inchiostro)}
.colophon ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

<div class="progresso" id="progresso" hidden></div>

<div class="servizio">
  <div class="wrap">
    <span class="data" id="oggi"></span>
    <span class="campanella" id="campanella" title="Orario indicativo: 6 ore da 60 minuti, dalle 8:00, lunedì–venerdì">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/><path d="M12 3v2"/></svg>
      <span id="campanella-txt">…</span>
    </span>
    <div class="azioni">
      <button class="btn-ico" id="btn-cerca" aria-expanded="false" aria-controls="ricerca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Cerca</button>
      <button class="btn-ico" id="btn-testo" title="Dimensione del testo">A<span style="font-size:1.15em">A</span></button>
      <button class="btn-ico" id="btn-tema" title="Giorno / notte" aria-label="Cambia tema giorno o notte">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </div>
  </div>
</div>

<div class="ricerca" id="ricerca" hidden>
  <div class="wrap">
    <label class="etichetta" for="q">Cerca nel giornale</label>
    <input id="q" type="search" placeholder="Prova: Vesuvio, maturità, Calvino…" autocomplete="off">
    <ul id="risultati"></ul>
  </div>
</div>

<header class="testata">
  <div class="wrap">
    <div>
      <a href="#" aria-label="Prima pagina"><div class="nome">La Città <b>del Sole</b></div></a>
      <p class="sottotesta" id="sottotesta"></p>
    </div>
    <div class="numero-box" id="numero-box"></div>
  </div>
</header>

<nav class="cerchi" aria-label="I sette cerchi">
  <div class="wrap"><ol id="nav-cerchi"></ol></div>
</nav>

<main id="vista" class="wrap" tabindex="-1"></main>

<footer class="colophon">
  <div class="wrap" id="colophon"></div>
</footer>

<p>Tommaso Campanella nasce a Stilo, in Calabria, nel 1568. Frate domenicano, filosofo inquieto, nel 1599 viene arrestato con l'accusa di aver organizzato una congiura contro il governo spagnolo. Passerà circa ventisette anni nelle carceri di Napoli. È lì dentro, nel 1602, che scrive <em>La Città del Sole</em>: il racconto di una città ideale, costruita su sette cerchi concentrici, con un tempio dedicato al Sole al centro.</p>

<p>Il dettaglio che ci ha conquistati è questo: in quella città il sapere non sta chiuso in una stanza, ma è dipinto sui muri, e chi passa lo vede. Un giornale scolastico, in fondo, prova a fare la stessa cosa. Per questo il nostro è diviso in sette cerchi, dal mondo esterno fino a ciò che ci aspetta dopo la maturità, con il nuovo numero al centro, al posto del Sole.</p>
<h3>Il giornalista che dà il nome alla scuola</h3>
<p>Vincenzo Cuoco nasce nel 1770 a Civitacampomarano, in Molise, e partecipa alla Repubblica Napoletana del 1799. Quando la repubblica cade finisce in esilio, e nel 1801 pubblica il <em>Saggio storico sulla rivoluzione napoletana</em>. La sua tesi è ancora attuale: quella rivoluzione fallì perché fu «passiva», pensata da pochi e calata dall'alto, con idee e parole lontane dalla vita della gente.</p>
<p>Pochi lo ricordano, ma Cuoco fu anche giornalista: a Milano diresse il <em>Giornale italiano</em>. Da lui prendiamo una regola semplice. Un giornale serve solo se parla la lingua di chi lo legge. Scriveremo per gli studenti, non per stupire i professori.</p>

  corpo: `
<p>Napoli è forse l'unica città al mondo che si chiama “nuova” da venticinque secoli. Il nome viene dal greco <em>Neápolis</em>: la fondarono, secondo la tradizione intorno al 470 a.C., i coloni greci di Cuma, accanto a un insediamento più antico, Partenope, sorto sull'altura di Pizzofalcone.</p>
<span class="a-margine"><b>Partenope</b> è il nome della sirena che, secondo il mito, si lasciò morire dopo che Ulisse resistette al suo canto. Il suo corpo sarebbe arrivato a riva proprio qui.</span>
<p>La città nuova fu progettata a tavolino, con un sistema di strade ortogonali: tre grandi vie parallele, i decumani, tagliate da vie più strette, i cardini. È uno schema che i manuali chiamano “ippodameo”, dal nome dell'architetto Ippodamo di Mileto, e lo studiamo in storia dell'arte senza accorgerci che lo percorriamo ogni giorno.</p>
<h3>L'itinerario: un'ora, tre strade</h3>

<li><b>Decumano superiore.</b> Il più stretto e silenzioso, tra via della Sapienza e via Anticaglia, dove restano gli archi del teatro romano inglobati nelle case.</li>
</ol>

<blockquote>Non serve un biglietto aereo per fare un viaggio d'istruzione: basta alzare gli occhi in via dei Tribunali.</blockquote>
<p>Un consiglio pratico: fate il percorso in gruppo, di mattina presto, con una mappa stampata della griglia antica. Provate a riconoscere dove un vicolo segue ancora il tracciato greco e dove invece la città lo ha piegato. È un esercizio di storia, ma anche di geometria.</p>`,

  slug: "campi-flegrei-senza-panico", cerchio: "laboratorio", firma: "A.C.", data: "2026-11-03",

  sommario: "Viviamo accanto a uno dei vulcani più studiati del pianeta. Cos'è il bradisismo, chi lo misura e dove informarsi davvero, lontano dalle catene di messaggi.",
  corpo: `
<p>Quando la terra trema a Pozzuoli, i telefoni di mezza Napoli si riempiono di messaggi inoltrati, audio di sconosciuti e previsioni che nessuno può fare. Proviamo a fare il contrario: capire cosa succede, con calma, usando le fonti giuste.</p>
<h3>Cos'è il bradisismo</h3>
<p>I Campi Flegrei sono una caldera: una grande depressione nata dal collasso del terreno dopo eruzioni molto antiche. In quest'area il suolo si alza e si abbassa lentamente, nel corso di mesi e anni. Questo movimento si chiama bradisismo, dal greco <em>bradýs</em>, “lento”. Il sollevamento è spesso accompagnato da piccoli terremoti, generalmente poco profondi.</p>
<span class="a-margine"><b>Un esempio da manuale.</b> Le colonne del Macellum di Pozzuoli, il cosiddetto “Tempio di Serapide”, portano i fori lasciati da molluschi marini: segno che in passato sono state sott'acqua e poi sono riemerse.</span>
<p>Non è un fenomeno nuovo. Il Novecento ha conosciuto due grandi crisi, nel 1970-72 e nel 1982-84, e dal 2005 è in corso una nuova fase di sollevamento, seguita giorno per giorno dai ricercatori.</p>
<h3>Chi lo misura</h3>
<p>Il monitoraggio è affidato all'Osservatorio Vesuviano, oggi sezione di Napoli dell'Istituto Nazionale di Geofisica e Vulcanologia (INGV). Fondato nel 1841, è il più antico osservatorio vulcanologico del mondo. Stazioni sismiche, GPS, misure dei gas e del suolo producono bollettini pubblici e periodici che chiunque può leggere.</p>
<h3>Cosa possiamo fare noi</h3>
<ul>
<li>Informarci solo da fonti ufficiali: INGV-Osservatorio Vesuviano, Protezione Civile, Comune.</li>
<li>Conoscere il piano di emergenza della propria zona e le aree di attesa, senza aspettare un evento.</li>
<li>Non inoltrare messaggi senza fonte: un audio allarmistico fa più danni di quanto sembri.</li>
<li>Partecipare con serietà alle prove di evacuazione della scuola.</li>
</ul>
<p>Conoscere un fenomeno naturale non lo rende innocuo, ma toglie spazio alla paura costruita sul niente. È anche il motivo per cui studiamo scienze.</p>`,

{
  slug: "pensare-con-lia", cerchio: "laboratorio", firma: "A.P.", data: "2026-11-02",
  titolo: "Copiare dall'IA o pensare con l'IA? Sei regole che usiamo in redazione",
  sommario: "Gli assistenti di intelligenza artificiale sono già nei nostri compiti. Il punto non è vietarli, ma usarli senza consegnare loro il cervello.",
  corpo: `
<p>Chi dice di non aver mai chiesto aiuto a un chatbot per un compito, probabilmente non sta dicendo tutta la verità. Gli strumenti di intelligenza artificiale generativa sono ovunque. Il problema non è lo strumento: è quando smettiamo di pensare e cominciamo solo a incollare.</p>
<p>Chi scrive sviluppa software e lavora ogni giorno con questi sistemi. Proprio per questo sa quanto sono bravi a produrre testi credibili, e quanto facilmente sbagliano con sicurezza. Ecco le regole che la nostra redazione si è data.</p>
<ol>
<li><b>Prima pensa, poi chiedi.</b> Scrivi da solo la scaletta. Usa l'IA per metterla alla prova, non per inventarla.</li>
<li><b>Verifica ogni dato.</b> Date, nomi e citazioni vanno controllati su una fonte primaria. I modelli linguistici possono inventare riferimenti che sembrano veri.</li>
<li><b>Dichiara l'uso.</b> Se un testo è stato rivisto con l'aiuto di un assistente, si dice. È onestà, non debolezza.</li>
<li><b>Nessun dato personale.</b> Non incollare mai nomi, voti o situazioni di compagni e professori in un chatbot: quei testi escono dal tuo controllo.</li>
<li><b>Fatti contraddire.</b> Chiedi all'IA di trovare i punti deboli del tuo ragionamento. È l'uso più utile e il meno praticato.</li>
<li><b>L'ultima parola è tua.</b> Se non sapresti spiegare a voce quello che hai consegnato, non è un tuo lavoro.</li>
</ol>
<span class="a-margine"><b>Prova pratica.</b> Chiedete a un assistente la biografia di un personaggio poco noto della vostra città, poi controllatela su un'enciclopedia. Contate gli errori.</span>
<blockquote>Un assistente che scrive al posto tuo ti fa risparmiare un'ora. Uno che ti fa domande ti fa risparmiare un anno.</blockquote>
<p>A scuola si va per imparare a ragionare, non per produrre fogli. L'intelligenza artificiale può essere un ottimo compagno di studio, a patto di ricordare chi deve uscire dall'esame con qualcosa in testa.</p>`,

  sommario: "Napoli, le isole del golfo, le città che non esistono e la chimica raccontata come un romanzo. Una lista breve, da finire prima della maturità.",
  corpo: `
<p>Le liste di libri consigliati spesso sembrano compiti per le vacanze. Questa no: sono cinque titoli scelti perché parlano di luoghi che conosciamo o di domande che ci facciamo, e si leggono in pochi giorni.</p>
<h3>1. Elsa Morante, <em>L'isola di Arturo</em> (1957)</h3>
<p>Procida, un ragazzo che cresce quasi da solo e idealizza un padre sempre assente. Ha vinto il Premio Strega ed è uno dei romanzi più belli mai scritti sull'adolescenza. Leggetelo, poi prendete l'aliscafo.</p>
<h3>2. Anna Maria Ortese, <em>Il mare non bagna Napoli</em> (1953)</h3>
<p>Racconti e reportage su una Napoli del dopoguerra lontana dalle cartoline. Un libro scomodo, che fece discutere molto. Utile per capire quanto il modo di raccontare una città cambi la città stessa.</p>
<h3>3. Italo Calvino, <em>Le città invisibili</em> (1972)</h3>
<p>Marco Polo descrive a Kublai Khan città che forse non esistono. Ogni capitolo dura poche pagine. È il compagno perfetto della Città del Sole di Campanella: due modi di immaginare il luogo in cui vorremmo vivere.</p>
<span class="a-margine"><b>Collegamento per l'orale.</b> Utopie a confronto: Campanella, Moro, Calvino. Funziona in italiano, filosofia e storia dell'arte.</span>
<h3>4. Erri De Luca, <em>Montedidio</em> (2001)</h3>
<p>Un ragazzo di tredici anni nel rione Sanità, un boomerang, un diario scritto su un rotolo di carta. Lingua asciutta, napoletana anche quando è italiana.</p>
<h3>5. Primo Levi, <em>Il sistema periodico</em> (1975)</h3>

<blockquote>Leggere un libro ambientato nel proprio quartiere è un modo per vederlo, finalmente, da fuori.</blockquote>

  corpo: `
<p>Con una circolare del Ministero dell'Istruzione e del Merito, dall'anno scolastico 2025/26 il divieto di usare il cellulare durante l'orario scolastico è stato esteso anche alle scuole secondarie di secondo grado, con le eccezioni previste, per esempio per gli studenti che ne hanno bisogno per motivi di salute o per un percorso personalizzato. Il regolamento di ogni istituto stabilisce i dettagli.</p>
<p>In redazione non eravamo d'accordo, e invece di scegliere una linea abbiamo fatto parlare entrambe le parti. Le due voci restano anonime, come previsto dalla nostra Carta.</p>

<div><span class="etichetta">Pro · voce di una studentessa</span><p>Per la prima volta l'intervallo è rumoroso. Si parla, si litiga, si gioca a carte. Prima eravamo venti persone in silenzio a scorrere video. Nessuno mi ha tolto niente: mi hanno restituito tre ore di attenzione al giorno. E il telefono, a casa, è ancora lì.</p></div>
<div><span class="etichetta">Contro · voce di uno studente</span><p>Abbiamo diciotto anni, votiamo, alcuni guidano. Ci chiedono di essere cittadini digitali consapevoli e poi tolgono lo strumento invece di insegnarci a usarlo. Il problema non è il telefono, è che nessuno ci ha mai spiegato come non farsene dominare.</p></div>

  corpo: `
<p>Novembre della quinta è il momento in cui tutti ti chiedono «e dopo?», e la risposta più onesta è spesso «non lo so». Va benissimo. Ma conviene sapere quali porte esistono, e quando si chiudono.</p>
<h3>Le università di Napoli</h3>
<p>La città ha una scelta rara. La Federico II, fondata nel 1224 dall'imperatore Federico II di Svevia, è la più antica università statale del mondo. L'Orientale nasce dal Collegio dei Cinesi del Settecento ed è specializzata in lingue e culture. Ci sono poi la Parthenope, l'Università della Campania Luigi Vanvitelli e il Suor Orsola Benincasa.</p>
<span class="a-margine"><b>Il TOLC</b> è il test online del consorzio CISIA usato da molti corsi di ingegneria, scienze ed economia. Si può sostenere già in quarta e in quinta, più volte: conviene provarlo presto.</span>
<h3>Gli altri percorsi</h3>
<ul>
<li><b>ITS Academy:</b> corsi biennali post-diploma molto legati alle aziende, in settori come digitale, energia, meccanica e turismo.</li>
<li><b>AFAM:</b> Conservatorio, Accademia di Belle Arti e istituti di alta formazione artistica e musicale.</li>
<li><b>Lavoro e servizio civile:</b> un anno di esperienza può chiarire le idee più di dieci open day.</li>
</ul>
<h3>Area medica</h3>
<p>Per Medicina, Odontoiatria e Veterinaria l'accesso è stato riformato: al posto del vecchio test d'ingresso c'è un primo semestre aperto, con esami di fisica, chimica e biologia che determinano la graduatoria. Le regole sono recenti e possono cambiare: controllate sempre il bando dell'anno in corso sul sito del Ministero dell'Università.</p>
<h3>Da fare entro la primavera</h3>
<ol>
<li>Segnare le date degli open day e dei TOLC.</li>
<li>Parlare con almeno uno studente universitario del corso che vi interessa.</li>
<li>Controllare borse di studio e scadenze del diritto allo studio regionale.</li>
</ol>
<p>Non esiste la scelta perfetta, esiste la scelta informata. E si può sempre cambiare strada.</p>`,

{
  slug: "scudetti-e-citta", cerchio: "palestra", firma: "G.L.", data: "2026-10-29",
  titolo: "Due scudetti in tre anni, e quello che il tifo dice di noi",
  sommario: "Dal 2023 al 2025 Napoli ha festeggiato due volte. Ma la squadra più importante del quartiere è quella che gioca al campetto, senza telecamere.",
  corpo: `

function hash(str) { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function tokens() { const cs = getComputedStyle(document.documentElement); const g = n => cs.getPropertyValue(n).trim(); return { fondo: g("--carta-2"), carta: g("--carta"), ink: g("--inchiostro"), sole: g("--sole"), verde: g("--maiolica"), blu: g("--cielo"), filo: g("--filo") }; }

function disegnaTavola(cv) {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const T = tokens(), R = rng(hash(cv.dataset.seme || "sole"));
  const pal = [T.sole, T.verde, T.blu, T.ink];
  const pick = () => pal[Math.floor(R() * pal.length)];
  const W = r.width, H = r.height;
  ctx.fillStyle = T.fondo; ctx.fillRect(0, 0, W, H);
  const righe = cv.dataset.righe ? +cv.dataset.righe : (H > 300 ? 3 : 2);
  const lato = H / righe;
  // parametri del motivo, uguali per tutte le piastrelle (come in una vera maiolica)
  const c1 = pick(), c2 = pick(), c3 = pick(), c4 = pick();
  const rAng = .28 + R() * .22, petD = .18 + R() * .1, petRx = .07 + R() * .05, petRy = .03 + R() * .03;
  const rCen = .06 + R() * .07, punti = 4 + Math.floor(R() * 4), stile = Math.floor(R() * 3);
  const quarto = (s) => {
    // angolo: quarto di cerchio
    ctx.fillStyle = c1; ctx.beginPath(); ctx.moveTo(-s / 2, -s / 2); ctx.arc(-s / 2, -s / 2, s * rAng, 0, Math.PI / 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = T.fondo; ctx.beginPath(); ctx.arc(-s / 2, -s / 2, s * rAng * .55, 0, Math.PI * 2); ctx.fill();
    // petalo a 45°
    ctx.save(); ctx.rotate(-Math.PI * .75); ctx.translate(s * petD + s * petRx, 0);
    ctx.fillStyle = c2; ctx.beginPath(); ctx.ellipse(0, 0, s * petRx, s * petRy, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // puntini lungo l'asse
    ctx.fillStyle = c4;
    for (let i = 0; i < punti; i++) { const t = .12 + i * (.3 / punti); ctx.beginPath(); ctx.arc(0, -s * t - s * .05, s * .012, 0, Math.PI * 2); ctx.fill(); }
    if (stile === 1) { ctx.strokeStyle = c3; ctx.lineWidth = s * .018; ctx.beginPath(); ctx.arc(0, 0, s * .36, -Math.PI * .7, -Math.PI * .3); ctx.stroke(); }
    if (stile === 2) { ctx.fillStyle = c3; ctx.beginPath(); ctx.moveTo(0, -s / 2); ctx.lineTo(s * .06, -s * .42); ctx.lineTo(0, -s * .34); ctx.lineTo(-s * .06, -s * .42); ctx.closePath(); ctx.fill(); }
  };
  for (let y = 0; y < righe; y++) {
    for (let x = 0; x * lato < W; x++) {
      ctx.save(); ctx.translate(x * lato + lato / 2, y * lato + lato / 2);
      ctx.beginPath(); ctx.rect(-lato / 2, -lato / 2, lato, lato); ctx.clip();
      for (let q = 0; q < 4; q++) { ctx.save(); ctx.rotate(q * Math.PI / 2); quarto(lato); ctx.restore(); }
      ctx.fillStyle = c3; ctx.beginPath(); ctx.arc(0, 0, lato * rCen, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = T.fondo; ctx.beginPath(); ctx.arc(0, 0, lato * rCen * .4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = T.carta; ctx.lineWidth = 1.5; ctx.strokeRect(x * lato, y * lato, lato, lato);
    }
  }
}

    <section><h2>Ritmo di uscita</h2><p>Un numero al mese durante l'anno scolastico. Numero ${GIORNALE.numero}: ${esc(GIORNALE.mese)}. Prossimo numero: ${esc(GIORNALE.prossimo)}.</p></section>
  </div>`;
}

function nonTrovato() {
  return `<div class="pagina"><h1>Questa strada non porta da nessuna parte</h1><p class="intro">La pagina che cerchi non esiste o è stata spostata. <a href="#">Torna alla prima pagina</a>.</p></div>`;
}

/* ---------- router (hash semplici: #a-slug, #sezione-id, #carta, #redazione) ---------- */
function render() {
  const h = decodeURIComponent(location.hash.slice(1));
  let html, attivo = null, isArt = false;
  if (!h) html = home();
  else if (h.startsWith("a-")) { html = articolo(h.slice(2)); isArt = true; const a = ARTICOLI.find(x => x.slug === h.slice(2)); attivo = a && a.cerchio; }
  else if (h.startsWith("sezione-")) { attivo = h.slice(8); html = sezione(attivo); }
  else if (h === "carta") html = carta();
  else if (h === "redazione") html = redazione();
  else html = nonTrovato();
  vista.innerHTML = html;
  document.querySelectorAll("#nav-cerchi a").forEach(a => { if (a.dataset.id === attivo) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  $("#progresso").hidden = !isArt;
  const art = isArt && ARTICOLI.find(x => x.slug === h.slice(2));
  document.title = art ? `${art.titolo} · La Città del Sole` : "La Città del Sole";
  window.scrollTo(0, 0);
  requestAnimationFrame(disegnaTutte);
  collega();
}

function collega() {
  vista.querySelectorAll("[data-vai]").forEach(g => {
    const vai = () => { location.hash = g.dataset.vai; };
    g.addEventListener("click", vai);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); vai(); } });
  });
  const f = $("#form-problema");
  if (f) f.addEventListener("submit", e => {
    e.preventDefault();
    const v = parseFloat($("#risposta").value.replace(",", ".").replace("°", ""));
    const out = $("#esito");
    if (isNaN(v)) { out.textContent = "Scrivi un numero, per esempio 30,5."; return; }
    out.textContent = Math.abs(v - PROBLEMA.risposta) <= PROBLEMA.tolleranza ? "Esatto. Il Sole di dicembre è basso: apri la soluzione per il perché." : "Non ancora. Prova con l'aiuto qui sotto.";
  });
  const cp = $("#copia-link");
  if (cp) cp.addEventListener("click", () => {
    const url = location.href, out = $("#copia-esito");
    navigator.clipboard?.writeText(url).then(() => { out.textContent = "Link copiato."; }).catch(() => { out.textContent = url; });
    if (!navigator.clipboard) out.textContent = url;
  });
}

/* ---------- campanella: che ora di lezione è? ---------- */
function campanella() {
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes(), g = d.getDay();
  const el = $("#campanella"), t = $("#campanella-txt"); let txt, suona = false;
  if (g === 0 || g === 6) txt = "Niente lezioni oggi. Buona lettura.";
  else if (m < 480) txt = `Prima campanella alle 8:00 (tra ${480 - m} min)`;
  else if (m >= 840) txt = "Lezioni finite. Buona lettura.";
  else { const ora = Math.floor((m - 480) / 60) + 1, resto = 60 - ((m - 480) % 60); suona = resto <= 3; txt = `${ora}ª ora · campanella tra ${resto} min`; }
  t.textContent = txt; el.classList.toggle("suona", suona);
}

/* ---------- impianto ---------- */
function impianto() {
  const d = new Date();
  $("#oggi").textContent = `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`;
  $("#sottotesta").textContent = `Il giornale degli studenti del ${GIORNALE.scuola} · ${GIORNALE.citta}`;
  $("#numero-box").innerHTML = `<strong>N. ${GIORNALE.numero}</strong><span>Anno ${GIORNALE.anno} · ${GIORNALE.mese}</span>`;
  $("#nav-cerchi").innerHTML = CERCHI.map(c => `<li><a href="#sezione-${c.id}" data-id="${c.id}"><span>${c.n}</span>${c.nome}</a></li>`).join("");
  $("#colophon").innerHTML = `
    <div><h4>La Città del Sole</h4><p>Giornale scolastico online del ${esc(GIORNALE.scuola)}, ${esc(GIORNALE.citta)}. Anno ${GIORNALE.anno}, numero ${GIORNALE.numero}, ${esc(GIORNALE.mese)}.</p></div>
    <div><h4>I sette cerchi</h4><ul>${CERCHI.map(c => `<li><a href="#sezione-${c.id}">${c.n} · ${c.nome}</a></li>`).join("")}</ul></div>
    <div><h4>La redazione</h4><ul><li><a href="#redazione">Chi siamo e come scriverci</a></li><li><a href="#carta">Carta della redazione e privacy</a></li></ul>
      <p style="margin-top:10px">Ogni numero è rivisto dalla docente referente e pubblicato sotto la responsabilità del Dirigente scolastico.</p></div>
    <div><h4>Le illustrazioni</h4><p>Nessuna foto di studenti: le immagini sono maioliche generate dal codice del sito a partire dal titolo di ogni articolo. Ogni articolo ha la sua, e cambia colore di notte.</p></div>`;

  // tema
  const tema = store.get("cds-tema"); if (tema) document.documentElement.dataset.theme = tema;
  $("#btn-tema").addEventListener("click", () => {
    const scuro = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const nuovo = scuro ? "light" : "dark"; document.documentElement.dataset.theme = nuovo; store.set("cds-tema", nuovo); disegnaTutte();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", disegnaTutte);

  // dimensione testo
  const taglie = ["", "grande", "enorme"]; let ti = Math.max(0, taglie.indexOf(store.get("cds-taglia") || ""));
  const applica = () => { if (taglie[ti]) document.documentElement.dataset.size = taglie[ti]; else delete document.documentElement.dataset.size; };
  applica();
  $("#btn-testo").addEventListener("click", () => { ti = (ti + 1) % taglie.length; applica(); store.set("cds-taglia", taglie[ti]); requestAnimationFrame(disegnaTutte); });

  // ricerca
  const pannello = $("#ricerca"), q = $("#q"), ris = $("#risultati"), bc = $("#btn-cerca");
  bc.addEventListener("click", () => { pannello.hidden = !pannello.hidden; bc.setAttribute("aria-expanded", !pannello.hidden); if (!pannello.hidden) q.focus(); });
  q.addEventListener("input", () => {
    const s = q.value.trim().toLowerCase();
    if (s.length < 2) { ris.innerHTML = ""; return; }
    const trovati = ARTICOLI.filter(a => (a.titolo + " " + a.sommario + " " + a.corpo.replace(/<[^>]+>/g, " ")).toLowerCase().includes(s));
    ris.innerHTML = trovati.length ? trovati.map(a => `<li><a href="#a-${a.slug}"><small>${cerchioDi(a.cerchio).nome}</small>${esc(a.titolo)}</a></li>`).join("") : `<li class="ui" style="color:var(--inchiostro-2)">Nessun articolo contiene “${esc(q.value)}”.</li>`;
  });
  ris.addEventListener("click", e => { if (e.target.closest("a")) { pannello.hidden = true; bc.setAttribute("aria-expanded", "false"); } });

  // barra di avanzamento della lettura
  addEventListener("scroll", () => {
    const p = $("#progresso"); if (p.hidden) return;
    const h = document.documentElement.scrollHeight - innerHeight; p.style.width = (h > 0 ? scrollY / h * 100 : 0) + "%";
  }, { passive: true });

  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(disegnaTutte, 120); });
  document.fonts?.ready.then(disegnaTutte);
  addEventListener("hashchange", render);
  campanella(); setInterval(campanella, 30000);
  render();
}
impianto();
</script>
